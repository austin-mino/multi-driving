<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TIDELINE — Harbor City Driving</title>
          <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');
    
    body {
      margin: 0;
      overflow: hidden;
      background: #0a0c10;
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      user-select: none;
    }
    
    #rotateWarning {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 12, 16, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px 50px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 1000;
      display: none;
      text-align: center;
    }

    /* 하이엔드 다크 모드 HUD */
    #hudContainer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }

    #hud {
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 24px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      min-width: 120px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    #gearDisplay {
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #3b82f6; /* 차분한 블루 액센트 */
      min-width: 50px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    #timerDisplay {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 28, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 20px;
      border-radius: 30px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #94a3b8;
      z-index: 100;
    }

    #controlsLeft {
      position: fixed;
      bottom: 35px;
      left: 35px;
      display: flex;
      gap: 15px;
      z-index: 110;
    }

    #driveControls {
      position: fixed;
      bottom: 35px;
      right: 35px;
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      gap: 15px;
      z-index: 110;
    }
    
    .drive-main-btns {
      display: flex;
      gap: 15px;
    }

    #gearControls {
      position: fixed;
      top: 25px;
      right: 25px;
      display: flex;
      gap: 6px;
      z-index: 100;
    }

    button.controlBtn {
      padding: 18px 28px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button.controlBtn:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(255, 255, 255, 0.2);
    }

    button.controlBtn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.1);
    }

    #gearControls button.controlBtn {
      padding: 8px 14px;
      font-size: 13px;
      background: transparent;
      border-color: rgba(255, 255, 255, 0.1);
      color: #64748b;
    }
    
    #gearControls button.controlBtn.active-gear {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #3b82f6;
    }

    #btnReset.controlBtn {
      padding: 10px 18px;
      font-size: 13px;
      background: rgba(220, 38, 38, 0.1);
      border-color: rgba(220, 38, 38, 0.2);
      color: #ef4444;
    }

    #btnToggleCam {
      position: fixed;
      top: 75px;
      right: 25px;
      padding: 6px 14px;
      font-size: 11px;
      background: transparent;
      color: #64748b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      z-index: 100;
    }

    #startMenu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 12px;
      z-index: 2000;
      width: 340px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    #startMenu h2 { font-weight: 800; color: #fff; margin-bottom: 30px; text-align: center; }
    #startMenu label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; font-weight: 600; }
    #startMenu input, #startMenu select { width: 100%; padding: 12px; margin-bottom: 20px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
    #startButton { width: 100%; padding: 16px; background: #3b82f6; color: #fff; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    #startButton:hover { background: #2563eb; }
    
    #adminPanel {
      position: fixed;
      top: 25px;
      left: 25px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      z-index: 200;
      display: none;
      width: 300px;
      box-sizing: border-box;
    }

    #adminPanel h3 {
      margin: 0 0 14px;
      font-size: 15px;
      white-space: nowrap;
    }

    #adminPanel .admin-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 28px;
      margin-bottom: 8px;
    }

    #adminPanel .admin-row label {
      flex: 0 0 132px;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #cbd5e1;
      font-size: 11px;
      line-height: 1.2;
    }

    #adminPanel .admin-row label span {
      display: inline-block;
      min-width: 24px;
      text-align: right;
    }

    #adminPanel .admin-row input[type="range"] {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      margin: 0;
      display: block;
    }

      /* 쇼룸 시작 메뉴 스타일 */
    #startMenu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8, 12, 20, 0.94);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 28px 32px;
      border-radius: 16px;
      z-index: 2000;
      width: 400px;
      box-sizing: border-box;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.58), 0 0 0 1px rgba(59, 130, 246, 0.06);
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      transition: top 0.28s ease, left 0.28s ease, right 0.28s ease, transform 0.28s ease, width 0.28s ease, padding 0.28s ease, border-radius 0.28s ease;
    }

    #startMenu.start-menu-compact {
      top: 24px;
      right: 24px;
      left: auto;
      transform: none;
      width: 188px;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(8, 12, 20, 0.78);
      border-color: rgba(96, 165, 250, 0.32);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.38);
    }

    #startMenu.start-menu-compact .showroom-step {
      display: none !important;
    }

    #compactCarPopup {
      display: none;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 30px;
      padding: 2px 3px;
      box-sizing: border-box;
      border: 0;
      background: transparent;
      color: #e2e8f0;
      cursor: pointer;
      text-align: left;
    }

    #startMenu.start-menu-compact #compactCarPopup {
      display: flex;
    }

    #compactCarPopup:hover #compactCarName {
      color: #93c5fd;
    }

    #compactCarPopup .compact-car-caption {
      color: #64748b;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    #compactCarName {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
      transition: color 0.18s ease;
    }

    #compactCarPopup .compact-car-arrow {
      color: #60a5fa;
      font-size: 14px;
      line-height: 1;
    }

    #startMenu:not(.start-menu-compact) .showroom-step h2 {
      margin-bottom: 9px;
      font-size: 20px;
    }

    #startMenu:not(.start-menu-compact) .step-desc {
      margin-bottom: 18px;
      font-size: 12px;
    }

    #startMenu:not(.start-menu-compact) #nicknameInput {
      padding: 14px 16px;
      margin-bottom: 18px;
      font-size: 16px;
    }

    #startMenu:not(.start-menu-compact) .current-car-button {
      padding: 13px 15px;
    }

    #startMenu:not(.start-menu-compact) #currentCarName {
      font-size: 16px;
    }

    #startMenu:not(.start-menu-compact) .car-options-panel {
      padding: 10px;
      top: calc(100% + 8px);
    }

    #startMenu:not(.start-menu-compact) .car-select-grid {
      gap: 8px;
    }

    #startMenu:not(.start-menu-compact) .car-option-btn {
      padding: 12px 8px;
      font-size: 13px;
    }

    #startMenu:not(.start-menu-compact) .color-picker-wrapper {
      gap: 14px;
      padding: 14px;
    }

    #startMenu:not(.start-menu-compact) #colorInput {
      width: 58px;
      height: 42px;
      padding: 0;
      margin: 0;
    }

    #startMenu:not(.start-menu-compact) #colorHexDisplay {
      font-size: 15px;
    }

    #startMenu:not(.start-menu-compact) .showroom-btn,
    #startMenu:not(.start-menu-compact) .showroom-btn-sec {
      padding-top: 12px;
      padding-bottom: 12px;
      font-size: 13px;
    }
    .showroom-step h2 {
      margin: 0 0 4px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #fff;
      text-align: center;
    }
    .step-desc {
      margin: 0 0 10px 0;
      font-size: 9px;
      color: #94a3b8;
      text-align: center;
    }
    #nicknameInput {
      width: 100%;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }
    #nicknameInput:focus {
      border-color: #3b82f6;
    }
    .vehicle-select-control {
      position: relative;
      margin-bottom: 10px;
    }
    .current-car-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 4px 7px;
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #f8fafc;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .current-car-button:hover,
    .current-car-button.is-open {
      background: rgba(51, 65, 85, 0.9);
      border-color: #3b82f6;
    }
    #currentCarName {
      color: #e2e8f0;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
    }
    .current-car-label,
    .current-car-chevron {
      display: none;
    }
    .car-options-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 5px);
      padding: 5px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }
    .car-options-panel[hidden] {
      display: none;
    }
    .car-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .car-option-btn {
      padding: 6px 4px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .car-option-btn:hover {
      background: rgba(51, 65, 85, 0.8);
      color: #fff;
    }
    .car-option-btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
      color: #3b82f6;
    }
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      background: rgba(30, 41, 59, 0.4);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #colorInput {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 20px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }
    #colorInput::-webkit-color-swatch-wrapper { padding: 0; }
    #colorInput::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; }
    #colorHexDisplay {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .showroom-btn {
      width: 100%;
      padding: 7px 8px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .showroom-btn:hover { background: #2563eb; }
    .showroom-nav-btns {
      display: flex;
      gap: 5px;
    }
    .showroom-btn-sec {
      width: 40%;
      padding: 7px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #94a3b8;
      font-weight: 600;
      font-size: 10px;
      cursor: pointer;
    }
    .showroom-btn-sec:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .showroom-nav-btns .showroom-btn { width: 60%; }

    /* 차량 선택 후 화면 가장자리에서만 보이는 플로팅 컨트롤 */
    #vehicleNameBar {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      width: 164px;
      min-height: 30px;
      padding: 5px 9px;
      box-sizing: border-box;
      background: rgba(15, 20, 28, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 20px;
      color: #f8fafc;
      cursor: pointer;
      z-index: 2100;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
    }

    #vehicleNameBar.is-visible {
      display: flex;
    }

    #vehicleNameBar:hover {
      border-color: rgba(96, 165, 250, 0.72);
      background: rgba(20, 30, 44, 0.88);
    }

    #vehicleNameBar .vehicle-bar-label {
      color: #64748b;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    #vehicleNameBarText {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-align: center;
    }

    #vehicleNameBar .vehicle-bar-arrow {
      color: #60a5fa;
      font-size: 13px;
      line-height: 1;
    }

    #liveColorPicker {
      position: fixed;
      top: 24px;
      left: 24px;
      display: none;
      flex-direction: column;
      gap: 14px;
      width: 250px;
      padding: 20px;
      box-sizing: border-box;
      background: rgba(15, 20, 28, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(96, 165, 250, 0.45);
      border-radius: 14px;
      z-index: 2100;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
    }

    #liveColorPicker.is-visible {
      display: flex;
    }

    .live-color-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    #liveColorHex {
      color: #3b82f6;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .live-color-control {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    #liveColorInput {
      width: 64px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }

    #liveColorInput::-webkit-color-swatch-wrapper { padding: 0; }
    #liveColorInput::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; }

    .live-color-help {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    #liveStartButton {
      width: 100%;
      padding: 12px 10px;
      margin-top: 5px;
      border: 1px solid rgba(96, 165, 250, 0.5);
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.3);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #liveStartButton:hover { 
      background: #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
      transform: translateY(-1px);
    }



    /* ===== CITY MINIMAP ===== */
    #minimapWrap {
      position: fixed;
      top: 25px;
      left: 25px;
      width: 218px;
      height: 218px;
      padding: 7px;
      box-sizing: border-box;
      background: rgba(6, 10, 16, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      z-index: 160;
      box-shadow: 0 14px 35px rgba(0,0,0,0.35);
      pointer-events: none;
    }
    #minimapCanvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 9px;
    }
    #minimapHeader {
      position: absolute;
      left: 13px;
      top: 10px;
      color: rgba(255,255,255,0.72);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.65);
    }
    #minimapLegend {
      position: absolute;
      left: 13px;
      bottom: 10px;
      display: flex;
      gap: 8px;
      color: rgba(255,255,255,0.65);
      font-family: 'Inter', sans-serif;
      font-size: 8px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.65);
    }
    .miniLegendDot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      vertical-align: 0;
      margin-right: 3px;
      box-shadow: 0 0 6px currentColor;
    }
    @media (max-width: 760px) {
      #minimapWrap { width: 176px; height: 176px; top: 12px; left: 12px; }
      #minimapHeader { left: 11px; top: 9px; }
      #minimapLegend { left: 11px; bottom: 8px; gap: 6px; }
    }

<body>
  <!-- 3단계 시네마틱 쇼룸 시작 메뉴 -->
  <div id="startMenu">

// 마우스/터치 드래그 상태 저장
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let camAzimuthStart = camAzimuth;
let camElevationStart = camElevation;

// 마우스 이벤트 핸들러
function onPointerDown(event) {
  if (cameraMode === 'free') {
    isDragging = true;
    dragStart.x = event.clientX;
    dragStart.y = event.clientY;
    camAzimuthStart = camAzimuth;
    camElevationStart = camElevation;
  }
}
function onPointerMove(event) {
  if (isDragging && cameraMode === 'free') {
    const deltaX = event.clientX - dragStart.x;
    const deltaY = event.clientY - dragStart.y;

    const rotationSpeed = 0.05;

    camAzimuth = camAzimuthStart - deltaX * rotationSpeed;
    camElevation = camElevationStart - deltaY * rotationSpeed;

    camElevation = Math.min(Math.max(camElevation, 0.1), Math.PI - 0.1);
  }
}
  
function onPointerUp(event) {
  isDragging = false;
}

// 터치 이벤트도 동일하게 처리

document.getElementById('btnReset').addEventListener('click', resetCar);

function resetCar() {
  if (!chassisBody) return;
  // 위치는 그대로, 높이 약간 위로
  const pos = chassisBody.position;
  chassisBody.position.set(pos.x, pos.y + 1.5, pos.z);

  // 회전 초기화
  const yRot = getYRotation(chassisBody.quaternion);
  chassisBody.quaternion.setFromEuler(0, yRot, 0);

  // 속도 초기화
  chassisBody.velocity.set(0, 0, 0);
  chassisBody.angularVelocity.set(0, 0, 0);
}

// 쿼터니언에서 y축 회전값 추출
function getYRotation(q) {
  const siny_cosp = 2 * (q.w * q.y + q.z * q.x);
  const cosy_cosp = 1 - 2 * (q.y * q.y + q.z * q.z);
  return Math.atan2(siny_cosp, cosy_cosp);
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));

// ─── 쇼룸 전시장 세트 ───────────────────────────────────────

const SHOWROOM_CENTER = new THREE.Vector3(5000, 1000, 5000);

function createShowroomExhibition() {
  const exhibition = new THREE.Group();
  exhibition.name = 'ShowroomExhibition';
  exhibition.position.copy(SHOWROOM_CENTER);

  // 반사율이 높은 바닥과 차분한 벽면으로 차량 실루엣이 돋보이게 구성합니다.
  const floorMat = new THREE.MeshStandardMaterial({

    metalness: 0.86,
    roughness: 0.20
  });
  const stageMat = new THREE.MeshStandardMaterial({
    color: 0x26394f,
    metalness: 0.78,
    roughness: 0.18
  });
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x101a29,
    metalness: 0.34,
    roughness: 0.58
  });
  const panelMat = new THREE.MeshStandardMaterial({
    color: 0x17273a,
    metalness: 0.48,
    roughness: 0.38
  });
  const trimMat = new THREE.MeshStandardMaterial({
    color: 0x477da9,
    emissive: 0x0b2d4d,
    emissiveIntensity: 0.42,
    metalness: 0.35,
    roughness: 0.30
  });
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x4d9ed0,
    transparent: true,
    opacity: 0.62,
    depthWrite: false
  });

  // 넓은 반사 바닥
  const floor = new THREE.Mesh(new THREE.BoxGeometry(32, 0.18, 28), floorMat);
  floor.position.set(0, -3.48, 0);
  floor.receiveShadow = true;
  exhibition.add(floor);

  // 차량을 띄워 보여주는 이중 원형 단상
  const platformBase = new THREE.Mesh(new THREE.CylinderGeometry(8.25, 8.5, 0.38, 96), stageMat);
  platformBase.position.y = -3.06;
  platformBase.castShadow = true;
  platformBase.receiveShadow = true;
  exhibition.add(platformBase);

  const platformTop = new THREE.Mesh(new THREE.CylinderGeometry(7.9, 8.0, 0.16, 96), new THREE.MeshStandardMaterial({
    color: 0x344e68,
    metalness: 0.86,
    roughness: 0.14
  }));
  platformTop.position.y = -2.79;
  platformTop.receiveShadow = true;

  const outerRing = new THREE.Mesh(new THREE.TorusGeometry(8.05, 0.055, 12, 160), trimMat);

  outerRing.position.y = -2.57;

  const innerRing = new THREE.Mesh(new THREE.TorusGeometry(6.0, 0.025, 8, 128), glowMat);

  innerRing.position.y = -2.57;
  exhibition.add(innerRing);

  // 바닥 그리드: 빈 공간을 줄이고 전시장 깊이감을 만듭니다.
  const gridMat = new THREE.MeshBasicMaterial({
    color: 0x284968,
    transparent: true,
    opacity: 0.34,
    depthWrite: false
  });
  for (let x = -14; x <= 14; x += 2) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.012, 26), gridMat);
    line.position.set(x, -3.37, 0);
    exhibition.add(line);
  }
  for (let z = -12; z <= 12; z += 2) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(30, 0.012, 0.018), gridMat);
    line.position.set(0, -3.36, z);
    exhibition.add(line);
  }

  // 후면 벽과 깊이감 있는 중앙 패널
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(30, 14, 0.42), wallMat);
  backWall.position.set(0, 3.4, -13.0);
  backWall.receiveShadow = true;
  exhibition.add(backWall);

  const backPanel = new THREE.Mesh(new THREE.BoxGeometry(19, 9.2, 0.10), panelMat);
  backPanel.position.set(0, 3.1, -12.72);
  exhibition.add(backPanel);

  // 대형 수직 라이트 바와 벽면 프레임
  for (const x of [-12.0, -9.0, -6.0, 6.0, 9.0, 12.0]) {
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.075, 9.8, 0.05), glowMat);
    strip.position.set(x, 3.2, -12.62);
    exhibition.add(strip);

  const frameTop = new THREE.Mesh(new THREE.BoxGeometry(24, 0.08, 0.06), trimMat);

  // 카메라를 향한 후면 헤일로 링

  // 양쪽의 수직 기둥과 상부 브리지
  for (const x of [-13.7, 13.7]) {

  const overheadHalo = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.045, 10, 128), trimMat);

  });

  const particlePositions = [];

    const radius = 5.5 + (i % 9) * 0.65;

      Math.cos(angle) * radius,
      -1.8 + (i % 18) * 0.55,

  particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particlePositions, 3));
  const particles = new THREE.Points(particleGeometry, new THREE.PointsMaterial({
    color: 0x70b9e2,
    size: 0.055,
    transparent: true,

    depthWrite: false
  }));
  exhibition.add(particles);
  exhibition.userData.particles = particles;

  exhibition.visible = false;
  scene.add(exhibition);
  return exhibition;
}

function makeAsphaltTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#111111';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4000; i++) {
  const v = 12 + Math.random() * 10 | 0;
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(60, 60);
  return t;
}

function makeSidewalkTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#888888';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#707070';
  ctx.lineWidth = 1.5;
  for (let i = 0; i <= 128; i += 16) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 128); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(128, i); ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(5, 5);
  return t;
}

const buildingTextureCache = new Map();
function getBuildingTexture(hexColor, floors = 10, cols = 5) {
  const key = `${hexColor}|${floors}|${cols}`;
  if (buildingTextureCache.has(key)) return buildingTextureCache.get(key);
  const texture = makeBuildingTexture(hexColor, floors, cols);
  buildingTextureCache.set(key, texture);
  return texture;
}

function makeBuildingTexture(hexColor, floors = 10, cols = 5) {
  const w = 256, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const r = (hexColor >> 16) & 0xff;
  const g = (hexColor >> 8) & 0xff;
  const b = hexColor & 0xff;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, w, h);
  const fh = h / floors, cw = w / cols;
  for (let f = 0; f < floors; f++) {
    for (let col = 0; col < cols; col++) {
      const lit = Math.random() > 0.72;
      ctx.fillStyle = lit ? 'rgba(255,215,150,0.78)' : 'rgba(18,34,48,0.94)';
      ctx.fillRect(col * cw + cw * 0.12, f * fh + fh * 0.12, cw * 0.76, fh * 0.58);
      // 창문 테두리
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(col * cw + cw * 0.12, f * fh + fh * 0.12, cw * 0.76, fh * 0.58);
    }
  }
  return new THREE.CanvasTexture(c);
}

function seeded(value) {

function pointInCityLand(x, z) {

function addRoadSegment(x1, z1, x2, z2, width, options = {}) {
  const dx = x2 - x1, dz = z2 - z1;
  const length = Math.hypot(dx, dz);
  if (length < 1) return;
  const angle = Math.atan2(dz, dx);
  const midX = (x1 + x2) * 0.5, midZ = (z1 + z2) * 0.5;
  const isBridge = Boolean(options.bridge);
  const road = new THREE.Mesh(new THREE.BoxGeometry(length, 0.12, width), isBridge ? bridgeMat : roadSurfaceMat);
  road.position.set(midX, -4.91, midZ);
  road.rotation.y = -angle;
  road.receiveShadow = true;
  roadGroup.add(road);

  const at = (along, side) => ({
    x: midX + Math.cos(angle) * along - Math.sin(angle) * side,
    z: midZ + Math.sin(angle) * along + Math.cos(angle) * side
  });
  for (const side of [-1, 1]) {
    const curbPoint = at(0, side * (width * 0.5 - 0.42));
    const edge = new THREE.Mesh(new THREE.BoxGeometry(length, 0.035, 0.13), roadEdgeMat);
    edge.position.set(curbPoint.x, -4.835, curbPoint.z);
    edge.rotation.y = -angle;
    roadGroup.add(edge);
  }

  if (options.divided) {
    for (const side of [-1, 1]) {
      const p = at(0, side * 0.42);
      const line = new THREE.Mesh(new THREE.BoxGeometry(length, 0.028, 0.13), roadEdgeMat);
      line.position.set(p.x, -4.83, p.z);
      line.rotation.y = -angle;
      roadGroup.add(line);
    }
    const median = new THREE.Mesh(new THREE.BoxGeometry(length, 0.16, Math.min(2.4, width * 0.075)), medianMat);
    median.position.set(midX, -4.82, midZ);
    median.rotation.y = -angle;
    roadGroup.add(median);
  } else if (width >= 20) {
    for (let along = -length * 0.5 + 12; along < length * 0.5 - 6; along += 22) {
      const p = at(along, 0);
      cityRoadMarks.push({ x: p.x, z: p.z, y: -4.82, angle, length: 5, width: 0.16, color: 0xe8cf7b });
    }
  }

  if (options.sidewalk !== false && width >= 20 && !isBridge) {
    for (const side of [-1, 1]) {
      const offset = width * 0.5 + 2.0;
      const p = at(0, side * offset);
      const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(length, 0.16, 3.6), sidewalkMat);
      sidewalk.position.set(p.x, -4.82, p.z);
      sidewalk.rotation.y = -angle;
      sidewalk.receiveShadow = true;
      roadGroup.add(sidewalk);
      const cp = at(0, side * (width * 0.5 + 0.18));
      const curb = new THREE.Mesh(new THREE.BoxGeometry(length, 0.16, 0.28), curbMat);
      curb.position.set(cp.x, -4.80, cp.z);
      curb.rotation.y = -angle;
      roadGroup.add(curb);
    }
  }

  if (isBridge) {
    const railOffset = width * 0.5 + 0.55;
    for (const side of [-1, 1]) {
      const p = at(0, side * railOffset);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(length, 1.15, 0.16), railMat);
      rail.position.set(p.x, -4.0, p.z);
      rail.rotation.y = -angle;
      rail.castShadow = true;
      landmarkGroup.add(rail);
      for (let u = -length * 0.5 + 10; u < length * 0.5; u += 24) {
        const postPoint = at(u, side * railOffset);
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.35, 0.18), railMat);
        post.position.set(postPoint.x, -4.12, postPoint.z);
        post.rotation.y = -angle;
        landmarkGroup.add(post);
      }
    }
  }
  cityRoads.push({ type: 'segment', x1, z1, x2, z2, width, name: options.name || '', bridge: isBridge, divided: Boolean(options.divided) });
}

function addRingRoad(cx, cz, radius, width, name) {

    line.rotation.x = -Math.PI / 2;

// 도로 차선 점선은 한 번에 인스턴싱하여 수백 개의 개별 드로콜을 없앱니다.
function buildRoadMarkings() {
  if (!cityRoadMarks.length) return;
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const batch = new THREE.InstancedMesh(geometry, material, cityRoadMarks.length);
  const node = new THREE.Object3D();
  for (let i = 0; i < cityRoadMarks.length; i++) {
    const mark = cityRoadMarks[i];
    node.position.set(mark.x, mark.y, mark.z);
    node.rotation.set(0, -mark.angle, 0);
    node.scale.set(mark.length, 0.035, mark.width);
    node.updateMatrix();
    batch.setMatrixAt(i, node.matrix);
    batch.setColorAt(i, new THREE.Color(mark.color));
  }
  batch.instanceMatrix.needsUpdate = true;
  if (batch.instanceColor) batch.instanceColor.needsUpdate = true;
  roadGroup.add(batch);
}

function makePark(cx, cz, w, d, label = 'PARK') {
  const grass = new THREE.Mesh(new THREE.BoxGeometry(w, 0.24, d), grassMat);
  grass.position.set(cx, -4.83, cz);
  grass.receiveShadow = true;
  parkGroup.add(grass);
  const pathX = new THREE.Mesh(new THREE.BoxGeometry(w - 12, 0.045, 3.0), plazaMat);
  pathX.position.set(cx, -4.675, cz);
  parkGroup.add(pathX);
  const pathZ = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.045, d - 12), plazaMat);
  pathZ.position.set(cx, -4.67, cz);
  parkGroup.add(pathZ);
  for (let i = 0; i < Math.max(10, Math.floor(w * d / 1500)); i++) {
    const a = i * 2.39996;
    const r = Math.sqrt((i + 0.5) / Math.max(10, Math.floor(w * d / 1500)));
    const tx = cx + Math.cos(a) * r * w * 0.42;
    const tz = cz + Math.sin(a) * r * d * 0.40;
    if (Math.abs(tx - cx) < 6 || Math.abs(tz - cz) < 6) continue;
    createTree(tx, tz, 0.8 + cityRnd(i + Math.floor(cx), 31) * 0.36);
  }
  cityLandmarks.push({ type: 'park', x: cx, z: cz, w, d, label });
}

function createTree(x, z, scale = 1) {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(treeTrunkGeo, treeTrunkMat);
  trunk.position.y = -5 + 1.9 * scale;
  trunk.scale.setScalar(scale);
  const canopy = new THREE.Mesh(treeCanopyGeo, treeCanopyMat);
  canopy.position.y = -5 + 3.8 * scale;
  canopy.scale.set(scale, 1.12 * scale, scale);
  trunk.castShadow = canopy.castShadow = true;
  group.add(trunk, canopy);
  group.position.set(x, 0, z);
  parkGroup.add(group);
  addCityCollider({ x, y: -3.15, z }, { x: 0.75 * scale, y: 1.85 * scale, z: 0.75 * scale }, 0, 'park-tree');
}

    return false;

function distancePointToSegment(px, pz, x1, z1, x2, z2) {
  const vx = x2 - x1, vz = z2 - z1, wx = px - x1, wz = pz - z1;
  const vv = vx * vx + vz * vz || 1;
  const t = Math.max(0, Math.min(1, (wx * vx + wz * vz) / vv));
  return Math.hypot(px - (x1 + t * vx), pz - (z1 + t * vz));
}
function insideCityRoad(x, z, padding = 0) {
  for (const road of cityRoads) {
    if (road.type === 'segment' && distancePointToSegment(x, z, road.x1, road.z1, road.x2, road.z2) < road.width * 0.5 + padding) return true;
    if (road.type === 'circle' && Math.abs(Math.hypot(x - road.x, z - road.z) - road.radius) < road.width * 0.5 + padding) return true;
  }
  return false;
}

function districtForBlock(x, z) {
  const r = Math.hypot(x, z);
  if (r < 275) return 'downtown';
  if (x > 560 && z > -230 && z < 340) return 'waterfront';
  if (x < -300 && z < -230) return 'industrial';
  if (r > 535 && x < 100) return 'suburban';
  if (z > 120 && x < 250) return 'residential';
  return 'mixed';
}

function buildingFootprintsOverlap(a, b, clearance = 2) {
  const axes = [];
  for (const item of [a, b]) {
    const c = Math.cos(item.rotation || 0), s = Math.sin(item.rotation || 0);
    axes.push([c, -s], [s, c]);
  }
  const dx = b.x - a.x, dz = b.z - a.z;
  for (const [ax, az] of axes) {
    const ra = Math.abs(ax * Math.cos(a.rotation || 0) - az * Math.sin(a.rotation || 0)) * a.w * 0.5 +
      Math.abs(ax * Math.sin(a.rotation || 0) + az * Math.cos(a.rotation || 0)) * a.d * 0.5;
    const rb = Math.abs(ax * Math.cos(b.rotation || 0) - az * Math.sin(b.rotation || 0)) * b.w * 0.5 +
      Math.abs(ax * Math.sin(b.rotation || 0) + az * Math.cos(b.rotation || 0)) * b.d * 0.5;
    if (Math.abs(dx * ax + dz * az) >= ra + rb + clearance) return false;
  }
  return true;
}

// Building and rooftop meshes are grouped into a few instanced batches rather than
// hundreds of individual draw calls; the collision boxes remain one body per building.
function buildCityInstances() {
  const facade = getBuildingTexture(0x52616a, 24, 8);
  facade.wrapS = facade.wrapT = THREE.RepeatWrapping;
  const districts = ['downtown', 'mixed', 'residential', 'suburban', 'industrial', 'waterfront'];
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const node = new THREE.Object3D();
  const districtTint = {
    downtown: 0x9ba9ad, mixed: 0x8d9a9e, residential: 0x8c9b89,
    suburban: 0x81927f, industrial: 0xa08a70, waterfront: 0x8da6ae
  };
  for (const district of districts) {
    const list = cityBuildings.filter(b => b.district === district && !cityPortContainers.some(c => c.x === b.x && c.z === b.z));
    if (!list.length) continue;
    const mat = new THREE.MeshStandardMaterial({ map: facade, color: 0xffffff, roughness: district === 'downtown' ? 0.35 : 0.72, metalness: district === 'downtown' ? 0.22 : 0.08 });
    const batch = new THREE.InstancedMesh(boxGeo, mat, list.length);
    const roofs = new THREE.InstancedMesh(boxGeo, roofMat, list.length);
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      node.position.set(b.x, -5 + b.h * 0.5, b.z);
      node.rotation.set(0, b.rotation || 0, 0);
      node.scale.set(b.w, b.h, b.d);
      node.updateMatrix();
      batch.setMatrixAt(i, node.matrix);
      batch.setColorAt(i, new THREE.Color(b.color || districtTint[district]));

      const rw = Math.max(4, b.w * (0.22 + cityRnd(i, 65) * 0.18));
      const rd = Math.max(4, b.d * (0.22 + cityRnd(i, 66) * 0.18));
      const rh = Math.min(6, Math.max(2, b.h * 0.055));
      node.position.set(b.x + (cityRnd(i, 67) - 0.5) * b.w * 0.24, -5 + b.h + rh * 0.5, b.z + (cityRnd(i, 68) - 0.5) * b.d * 0.24);
      node.rotation.set(0, b.rotation || 0, 0);
      node.scale.set(rw, rh, rd);
      node.updateMatrix();
      roofs.setMatrixAt(i, node.matrix);
    }
    batch.instanceMatrix.needsUpdate = true;
    batch.castShadow = true;
    batch.receiveShadow = true;
    roofs.instanceMatrix.needsUpdate = true;
    roofs.castShadow = false;
    buildingGroup.add(batch, roofs);
  }
}

function createSportsCar(color = '#ffffff') {
  return new Promise((resolve) => {
    gltfLoader.load(
      'https://threejs.org/examples/models/gltf/ferrari.glb',
      (gltf) => {
        const car = gltf.scene;
        steeringWheelNode = null; // 헨들 조정 초기화

        car.traverse((child) => {
           child.castShadow = true;
           child.receiveShadow = true;
          // 핸들은 Mesh가 아닐 수도 있으므로 isMesh 체크를 아래로 이동하거나 이름 체크를 먼저 합니다.
          if (child.name === 'steering_wheel') {
            steeringWheelNode = child;
          }

          if (!child.isMesh) return;
          
          if (child.name === 'body') {
            child.material = new THREE.MeshStandardMaterial({

          steeringWheelNode = null;

          // -----------------------------------------------------
          // 기본 Mesh / 재질 처리
          // -----------------------------------------------------
          car.traverse((child) => {
            child.castShadow = true;
            child.receiveShadow = true;

            if (!child.isMesh) return;

            // GLB의 일부 파츠는 transform/geometry 변경 후 bounding sphere가 정확하지 않아
            // 카메라 각도에 따라 사라질 수 있다. Dodge는 차체 파츠 수가 적어 컬링을 끄는
            // 편이 외관 안정성 측면에서 안전하다.
            child.frustumCulled = false;
            if (!child.material) return;

            const hadMaterialArray = Array.isArray(child.material);
            const materials = hadMaterialArray ? child.material : [child.material];

            // GLB마다 차체 재질 이름이 Cars, Body, Material.001 등으로 다르므로
            // 이름을 넓게 판별한다. 유리·타이어·휠·램프·실내 재질은 제외한다.
            const bodyWords = /(car|body|paint|vehicle|exterior|chassis|shell|hood|bonnet|roof|door|fender|bumper|scoop|spoiler)/i;
            const protectedWords = /(glass|window|windshield|tire|tyre|wheel|rim|rubber|chrome|light|lamp|brake|disc|seat|interior|steering|dashboard|engine|exhaust)/i;
            const meshName = child.name || '';
            const isBodyMaterial = (material) => {
              if (!material) return false;
              const materialName = material.name || '';
              if (protectedWords.test(materialName) || protectedWords.test(meshName)) return false;
              // 투명/반투명 재질은 유리일 가능성이 높으므로 원본을 보존한다.
              if (material.transparent || material.opacity < 0.95 || material.transmission > 0.1) return false;
              // Dodge GLB의 상부 외장 파츠는 이름이 Material.xxx인 경우가 많다.
              // 보호 대상이 아닌 불투명 외장 재질은 차체 도장으로 취급한다.
              // 차체로 명시된 재질 또는 Mesh만 색상을 변경한다.
              // 마지막의 무조건 true 조건은 바퀴/유리/램프까지 색칠하는 원인이므로 사용하지 않는다.
              return bodyWords.test(materialName) || bodyWords.test(meshName);
            };

            let bodyMaterialIndexes = materials
              .map((material, index) => isBodyMaterial(material) ? index : -1)
              .filter((index) => index !== -1);

            // 이름이 없는 재질은 차체라고 추정하지 않는다.
            // 바퀴·유리·램프·실내가 우연히 단일 재질일 때 색칠되는 것을 방지한다.

            if (bodyMaterialIndexes.length) {

                if (m && bodyMaterialIndexes.includes(index) && m.color?.set) {
                  // 어두운 원본 albedo/vertex color가 새 색상 위에 곱해지지 않도록
                  // 차체 도장 재질의 색상 텍스처와 vertex color를 제거한다.
                  // 원본 색상/텍스처가 새 색상 위에 남지 않도록 색상 관련 맵을 모두 제거한다.
                  m.map = null;
                  m.normalMap = null;
                  m.roughnessMap = null;
                  m.metalnessMap = null;
                  m.emissiveMap = null;
                  m.aoMap = null;
                  m.vertexColors = false;
                  m.color.set(color);

                  if (m.emissive?.set) m.emissive.set(0x000000);
                  m.needsUpdate = true;

              child.material = hadMaterialArray ? recoloredMaterials : recoloredMaterials[0];

          });

          // 차량의 전후축/상하축을 게임 좌표계에 맞추는 보정은 시각 래퍼에만 적용한다.
          // 물리 차체의 쿼터니언은 바깥 시각 루트에 적용되므로 서로 덮어쓰지 않는다.
          car.scale.set(1, 1, 1);
          car.rotation.set(0, 0, 0);

            // 내보내기본도 허용해 모델 교체 시에도 바퀴 분리가 유지되게 한다.
            if (/^desirefx\.?me_077_43$/i.test(child.name || '')) wheelRoot = child;
          });

          const wheelNodes = [null, null, null, null];
          const embeddedWheelNodes = [null, null, null, null];

            'Dodge_SteeringWheel_Pivot_Box'
          );
          if (steeringWheelNode) {

              sourceParts.forEach((sourceMesh) => {
                splitDodgeMeshIntoFour(sourceMesh).forEach((geometry, index) => {

                const pivot = wheelBounds[index].getCenter(new THREE.Vector3());
                group.position.copy(pivot);

                splitParts[index].forEach(({ sourceMesh, geometry }) => {
                  geometry.translate(-pivot.x, -pivot.y, -pivot.z);

              // wheelRoot의 변환을 보존한다. 원본 Mesh만 제거하고 새 그룹을 같은
              // 부모 아래에 넣어, 차체와 바퀴의 좌표계가 달라지지 않게 한다.
              sourceParts.forEach((sourceMesh) => wheelRoot.remove(sourceMesh));
              wheelGroups.forEach((group, index) => {
                wheelRoot.add(group);
                wheelNodes[index] = group;
              });

              console.log(
                'Dodge 네 바퀴 분리 완료:',
                wheelGroups.map((group) => ({
                  name: group.name,
                  pivot: group.userData.pivot.toArray(),
                  parts: group.children.map((part) => part.name)
                }))
              );
            }
          } else if (wheelRoot) {
            console.warn('Dodge: 사전 분리 휠을 찾지 못해 원본 통합 휠을 그대로 유지합니다.');
          } else {
            console.warn('Dodge: desirefx.me_077_43 통합 바퀴 루트를 찾지 못했습니다.');
          }

          car.userData.wheelNodes = wheelNodes;
          car.userData.modelName = 'DodgeDemon';
          car.userData.visualOffsetY = -0.8;
          car.userData.steeringNode = steeringWheelNode;

          // -----------------------------------------------------
          // 차량 크기 자동 보정
          // -----------------------------------------------------
          car.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(car);
          const size = box.getSize(new THREE.Vector3());
          // 이 GLB는 Y축 방향으로 차량 길이가 저장돼 있으므로 세 축 중
          // 가장 긴 축을 차량 전장으로 사용한다.
          const vehicleLength = Math.max(size.x, size.y, size.z);
          const targetLength = DODGE_TARGET_LENGTH;

          if (vehicleLength > 0.001) {
            const scale = targetLength / vehicleLength;
            car.scale.multiplyScalar(scale);
          }

          // 고정 축 보정용 래퍼를 사용한다. 매 프레임 물리 회전을 받는 carModel
          // 자체를 회전시키면 wheel transform 계산과 충돌할 수 있기 때문이다.
          const visualRoot = new THREE.Group();
          visualRoot.name = 'DodgeDemonVisualRoot';

          // visualRoot는 매 프레임 물리 차체의 회전을 받으므로,
          // 고정 방향 보정은 실제 GLB인 car에 적용해야 덮어써지지 않는다.
          car.rotation.copy(DODGE_VISUAL_ROTATION);
          car.updateMatrixWorld(true);

          // 물리 회전 전용 루트는 초기 회전 0으로 둔다.
          visualRoot.rotation.set(0, 0, 0);
          visualRoot.add(car);

          // -----------------------------------------------------
          // 중심/바닥 정렬
          // -----------------------------------------------------
          car.updateMatrixWorld(true);
          const fittedBox = new THREE.Box3().setFromObject(car);
          const center = fittedBox.getCenter(new THREE.Vector3());

          car.position.x -= center.x;
          car.position.z -= center.z;
          car.position.y -= fittedBox.min.y;

          // startGame()/멀티플레이 코드가 기존 계약을 그대로 사용할 수 있도록
          // 사용자 데이터와 독립 바퀴 배열을 180도 래퍼에도 전달한다.
          visualRoot.userData.wheelNodes = wheelNodes;
          visualRoot.userData.modelName = 'DodgeDemon';
          visualRoot.userData.visualOffsetY = -0.8;
          visualRoot.userData.steeringNode = steeringWheelNode;
          resolve(visualRoot);
        },
        undefined,
        (error) => {
          console.error('Dodge Challenger SRT Demon 로드 실패:', error);
          resolve(createGrandeurIGCarDetailed(color));
        }
      );
    });
  }

    // 카메라 차량 뒤쪽 위치로 고정
   function updateCamera() {
  const carPos = interpolatedCarPosition.clone();
  
  // 1. 기본 오프셋 설정 (차량 뒤쪽 위)
  const offset = new THREE.Vector3(0, 6, 14);
  
  // 2. 조향에 따른 카메라 쏠림 효과 (원심력 표현)
  // steeringValue가 왼쪽(-)이면 카메라는 오른쪽(+)으로 살짝 이동
  const steeringLean = -steeringValue * 5; 
  offset.x += steeringLean;
  
  // 3. 속도에 따른 거리 조절 (속도가 빠르면 카메라가 더 멀어짐)
  const speed = getSpeedKmH();
  const speedFactor = Math.min(speed / 200, 1);
  offset.z += speedFactor * 4;
  offset.y += speedFactor * 1.5;

  offset.applyQuaternion(interpolatedCarQuaternion);
  const targetPos = carPos.clone().add(offset);

  // 4. 부드러운 위치 보간 (너무 딱딱하지 않게)
  camera.position.lerp(targetPos, 0.15);
  
  // 5. 시선 보간 (차량의 약간 앞쪽을 바라보게 하여 더 역동적으로)
  const lookAtOffset = new THREE.Vector3(0, 1, -5);
  lookAtOffset.applyQuaternion(interpolatedCarQuaternion);
  const lookAtTarget = carPos.clone().add(lookAtOffset);
  
  // 현재 카메라가 보고 있는 방향에서 목표 방향으로 부드럽게 회전
  const currentLookAt = new THREE.Vector3();
  camera.getWorldDirection(currentLookAt);
  const targetLookAt = lookAtTarget.clone().sub(camera.position).normalize();
  
  camera.lookAt(lookAtTarget);
}

   function updateFirstPersonCamera() {
  // 차종별 운전석 위치
  let offset;
   if (currentCarModel === 'SUV') {
    offset = new THREE.Vector3(0, 3.3, -3.6); // Range Rover 운전석
  } else if (currentCarModel === 'SportsCar') {
    offset = new THREE.Vector3(-0.85, 2.5, -0.25); // Ferrari
  } else if (currentCarModel === 'McLarenP1') {
    offset = new THREE.Vector3(0, 0.5, -4); // mclaren
  } else if (currentCarModel === 'PontiacPhoenix') {
    offset = new THREE.Vector3(-0.97, 2.66, 0.26); // Pontiac Phoenix
  } else if (currentCarModel === 'DodgeDemon') {
    offset = new THREE.Vector3(-0.85, 2.8, -0.4); // DodgeDemon
  } else {
    offset = new THREE.Vector3(-0.85, 2.5, -0.4); // 그랜저 기본
  }


  // 1인칭 흔들림 효과 (G-Force 표현)
  const speed = getSpeedKmH();
  const speedFactor = speed / 100;
  const shake = Math.sin(Date.now() * 0.01) * 0.0021618 * speedFactor;
  offset.y += shake;
  offset.x += -steeringValue * 0.5; // 조향 시 몸이 쏠리는 효과

  offset.applyQuaternion(interpolatedCarQuaternion);
  camera.position.copy(interpolatedCarPosition).add(offset);

  const forward = new THREE.Vector3(0, 0, -1);
  // 시선도 조향 방향으로 살짝 미리 보게 함
  const lookRotation = interpolatedCarQuaternion.clone();
  const steeringQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -steeringValue * 0.3);
  lookRotation.multiply(steeringQuat);
  
  forward.applyQuaternion(lookRotation);

  const lookAt = camera.position.clone().add(forward.multiplyScalar(20));
  camera.lookAt(lookAt);
}

// ----------------- 멀티플레이 관련 추가 코드 -----------------

  // ================= LIVE CITY MAP =================
  // 도시 렌더링과 동일한 world 좌표를 사용하고, 게임 프레임과 함께 움직입니다.
  const minimapCanvas = document.getElementById('minimapCanvas');
  const minimapCtx = minimapCanvas.getContext('2d');
  const MINI_SIZE = minimapCanvas.width;
  const MINI_WORLD_SIZE = CITY_MAP_EXTENT;
  let lastMinimapRender = 0;
  let latestPlayersSnapshot = {};

  function getBodyYRotation(body) {
    return body?.quaternion ? getYRotation(body.quaternion) : 0;
  }

  function miniMapPoint(x, z) {
    const scale = MINI_SIZE / MINI_WORLD_SIZE;
    return { x: (x + MINI_WORLD_SIZE * 0.5) * scale, y: (z + MINI_WORLD_SIZE * 0.5) * scale };
  }

  function clampMiniPoint(point) {
    return { x: Math.max(5, Math.min(MINI_SIZE - 5, point.x)), y: Math.max(5, Math.min(MINI_SIZE - 5, point.y)) };
  }

  function drawMiniCar(x, z, heading, fill, radius, outline = null) {
    const p = clampMiniPoint(miniMapPoint(x, z));
    const r = radius;
    minimapCtx.save();
    minimapCtx.translate(p.x, p.y);
    // 실제 차량 모델의 코·헤드라이트는 -Z를 향합니다. 지도에서는 -Z가 위쪽이므로
    // 삼각형의 끝을 위로 두고 쿼터니언 yaw와 같은 부호로 회전해야 전진 방향과 일치합니다.
    minimapCtx.rotate(-heading);
    minimapCtx.beginPath();
    minimapCtx.moveTo(0, -r * 1.55);
    minimapCtx.lineTo(r * 0.72, r * 0.82);
    minimapCtx.lineTo(0, r * 0.52);
    minimapCtx.lineTo(-r * 0.72, r * 0.82);
    minimapCtx.closePath();
    minimapCtx.fillStyle = fill;
    minimapCtx.shadowColor = fill;
    minimapCtx.shadowBlur = r * 1.5;
    minimapCtx.fill();
    if (outline) {
      minimapCtx.shadowBlur = 0;
      minimapCtx.lineWidth = 2;
      minimapCtx.strokeStyle = outline;
      minimapCtx.stroke();
    }
    minimapCtx.restore();
  }

  function hashPlayerColor(id) {
    let h = 0;
    const str = String(id);
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return `hsl(${Math.abs(h) % 360} 82% 62%)`;
  }

  function renderMinimap() {
    const ctx = minimapCtx;
    ctx.clearRect(0, 0, MINI_SIZE, MINI_SIZE);
    ctx.fillStyle = '#102a39';
    ctx.fillRect(0, 0, MINI_SIZE, MINI_SIZE);

    // 지형도는 3D 지형과 공유하는 해안 다각형에서 직접 그립니다.
    ctx.beginPath();
    CITY_COASTLINE.forEach(([x, z], i) => {
      const p = miniMapPoint(x, z);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.fillStyle = '#34413a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,202,184,0.62)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // 공원 녹지
    for (const landmark of cityLandmarks) {
      if (landmark.type !== 'park') continue;
      const a = miniMapPoint(landmark.x - landmark.w * 0.5, landmark.z - landmark.d * 0.5);
      const b = miniMapPoint(landmark.x + landmark.w * 0.5, landmark.z + landmark.d * 0.5);
      ctx.fillStyle = '#286043';
      ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
      ctx.strokeStyle = 'rgba(147,220,162,0.4)';
      ctx.lineWidth = 1;
      ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
    }

    // 도시 도로망(원형 도로·사선 대로·항만 교량)
    for (const road of cityRoads) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = road.bridge ? '#b3c4c5' : (road.width >= 30 ? '#788286' : '#4c5858');
      ctx.lineWidth = Math.max(1.4, road.width / MINI_WORLD_SIZE * MINI_SIZE);
      ctx.beginPath();
      if (road.type === 'segment') {
        const a = miniMapPoint(road.x1, road.z1);
        const b = miniMapPoint(road.x2, road.z2);
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
      } else if (road.type === 'circle') {
        const c = miniMapPoint(road.x, road.z);

      }

      if (road.divided && road.type === 'segment') {

        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(247,216,115,0.94)';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.restore();
    }

    const districtColors = {
      downtown: 'rgba(188,205,210,0.76)', mixed: 'rgba(164,179,179,0.72)',
      residential: 'rgba(174,192,169,0.73)', suburban: 'rgba(141,170,143,0.74)',
      industrial: 'rgba(191,150,111,0.76)', waterfront: 'rgba(143,183,194,0.76)'

    // 회전된 건물 footprint도 3D 배치와 같은 각도로 표시합니다.

                }

            } else if (remoteModelName.includes('McLarenP1')) {
                // ─── [2] 맥라렌 전용 바퀴 정렬 로직 ───
                const visualSteering = (i === 0 || i === 1) ? -steerAngle * 2.6 : 0;
                const steerQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), visualSteering);
                const rollQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pData.accumulatedRoll);
                
                const localTransform = new THREE.Quaternion().copy(steerQuat).multiply(rollQuat);
                const correctionQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
                let finalTransform = localTransform.clone().multiply(correctionQuat);
                
                if (wheel.userData.side === 'L') {
                    const LEFT_SIDE_INVERSION = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI);
                    finalTransform.multiply(LEFT_SIDE_INVERSION);
                }
                wheel.quaternion.copy(finalTransform);

                        } else if (remoteModelName.includes('DodgeDemon')) {
                const visualSteering = (i === 0 || i === 1) ? steerAngle * 2.6 : 0;
                const steerQuat = new THREE.Quaternion().setFromAxisAngle(
                  new THREE.Vector3(0, 0, 1),
                  -visualSteering
                );
                const rollQuat = new THREE.Quaternion().setFromAxisAngle(
                  new THREE.Vector3(1, 0, 0),
                  pData.accumulatedRoll
                );
                wheel.quaternion.copy(steerQuat.multiply(rollQuat));

            } else if (remoteModelName.includes('PontiacPhoenix')) {

              const visualSteering = (i === 0 || i === 1) ? -steerAngle * 2.6 : 0;
                // ─── [3] 폰티악 전용 바퀴 정렬 로직 (조향 및 반전 수정) ───
                // 싱글플레이와 동일하게 Y축 기준 조향
                const steerQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), visualSteering);
                
                // 싱글플레이에서 rollingQuat.invert()를 적용했으므로 구름(Roll) 방향을 반전(-)
                const rollQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -pData.accumulatedRoll);                
                
                // 조향 성분과 구름 성분 결합
                const localTransform = new THREE.Quaternion().copy(steerQuat).multiply(rollQuat);
                
                // 폰티악 전용 축 보정 (싱글플레이와 동일하게 Y축 -90도 회전)
                const correctionQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -Math.PI / 2, 0));
                const finalTransform = localTransform.clone().multiply(correctionQuat);
                
                // 싱글플레이처럼 baseQuaternion과 최종 변환을 곱해서 적용
                if (wheel.userData.baseQuaternion) {
                    wheel.quaternion.copy(wheel.userData.baseQuaternion.clone().multiply(finalTransform));
                } else {
                    wheel.quaternion.copy(finalTransform);
                }
            } else {
                // ─── [3] 일반 차량 로직 (그랜저, 스포츠카 등) ───
                const finalSteer = (i === 0 || i === 1) ? steerAngle * 2.6 : 0;
                const steerQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -finalSteer);
                const rollQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pData.accumulatedRoll);

                const finalTransform = new THREE.Quaternion().copy(steerQuat).multiply(rollQuat);

                if (wheel.userData.baseQuaternion) {
                    wheel.quaternion.copy(finalTransform).multiply(wheel.userData.baseQuaternion);
                } else {
                    wheel.quaternion.copy(finalTransform);
                }
            }

            wheel.updateMatrix();
        } // 바퀴 loop 끝
        pData.lastPos.copy(pData.model.position);
    }
  } 

 // 조명 위치가 차량을 따라다니도록 업데이트 (그림자 품질 유지)
    sun.position.set(interpolatedCarPosition.x + 200, interpolatedCarPosition.y + 400, interpolatedCarPosition.z + 100);

  hud.textContent = `${Math.floor(getSpeedKmH())} KM/H`; gearDisplay.textContent = `${currentGear}`;
      // 카메라 따라가기
const carPos = interpolatedCarPosition; // 보간된 차량 위치 사용

if (cameraMode === 'third') {
  updateCamera();
} else if (cameraMode === 'first') {

} else {
  const desiredX = carPos.x + camDistance * Math.sin(camElevation) * Math.sin(camAzimuth);
  const desiredY = carPos.y + camDistance * Math.cos(camElevation);
  const desiredZ = carPos.z + camDistance * Math.sin(camElevation) * Math.cos(camAzimuth);
  
  // 쿠션감(lerp) 제거 -> 위치 및 시선 즉시 100% 동기화 (두두둑 거림 원천 차단)
  camera.position.set(desiredX, desiredY, desiredZ);
  camera.lookAt(carPos);
}

      // 타이머 업데이트
      updateTimer();

      renderer.render(scene, camera);

    // ─── 쇼룸 미리보기 3D 시스템 (고급 3D 쇼룸) ─────────────────────────────
    let previewCarModel = null;
    let selectedCarModelName = 'SportsCar';
    let selectedCarColor = '#ffffff';

    // 쇼룸 차량의 외형 전장 기준. 모델 원본 스케일이 서로 달라도 같은 크기로 보이게 합니다.
    // 단상 폭을 충분히 활용하도록 기존 7.2보다 크게 설정
    const SHOWROOM_VEHICLE_LENGTH = 10.0;
    function normalizePreviewCarScale(model, scaleMultiplier = 1) {
      model.updateMatrixWorld(true);

      const originalBox = new THREE.Box3().setFromObject(model);
      const originalSize = originalBox.getSize(new THREE.Vector3());
      const footprintLength = Math.max(originalSize.x, originalSize.z);

      if (footprintLength > 0.001) {
        const fitScale = (SHOWROOM_VEHICLE_LENGTH / footprintLength) * scaleMultiplier;
        model.scale.multiplyScalar(fitScale);
      }

      model.updateMatrixWorld(true);
      const fittedBox = new THREE.Box3().setFromObject(model);
      const fittedCenter = fittedBox.getCenter(new THREE.Vector3());
      const stageTopY = SHOWROOM_CENTER.y - 2.83;

      // 중앙 정렬 및 단상 위 바닥 높이 정렬
      model.position.x += SHOWROOM_CENTER.x - fittedCenter.x;
      model.position.z += SHOWROOM_CENTER.z - fittedCenter.z;
      model.position.y += stageTopY - fittedBox.min.y;
      model.updateMatrixWorld(true);
    }

    async function initPreviewCar(modelName, color) {
      if (previewCarModel) {
        scene.remove(previewCarModel);
        previewCarModel = null;
      }
      
      console.log("Loading preview for:", modelName, color);
      
      if (modelName === 'GrandeurIG') {
        previewCarModel = createGrandeurIGCarDetailed(color);
      } else if (modelName === 'SportsCar') {
        previewCarModel = await createSportsCar(color);
      } else if (modelName === 'SUV') {
        previewCarModel = await createSUVCar(color);
      } else if (modelName === 'McLarenP1') {
        previewCarModel = await createMcLarenP1(color);
      } else if (modelName === 'PontiacPhoenix') {
        previewCarModel = await createPontiacPhoenix(color);
      } else if (modelName === 'DodgeDemon') {
        previewCarModel = await createDodgeDemon(color);
      }
      
      if (previewCarModel) {
        // 게임 맵과 완전히 격리된 별도의 쇼룸 좌표에 위치 설정
        previewCarModel.position.set(SHOWROOM_CENTER.x, SHOWROOM_CENTER.y - 3.0, SHOWROOM_CENTER.z);
        previewCarModel.rotation.set(0, 0, 0);

        // 폰티악은 게임용 바퀴 축 보정(90도)을 유지하되, 쇼룸에서는 그 보정만 되돌립니다.
        // 따라서 실제 주행 바퀴 정렬은 건드리지 않고 미리보기만 정상 방향으로 표시됩니다.
        if (modelName === 'PontiacPhoenix' && previewCarModel.userData.wheelNodes) {
          const undoPontiacPreviewRotation = new THREE.Quaternion().setFromAxisAngle(
            new THREE.Vector3(0, 1, 0),
            -Math.PI / 2
          );
          previewCarModel.userData.wheelNodes.forEach((node) => {
            if (node?.userData?.baseQuaternion) {
              node.quaternion.copy(node.userData.baseQuaternion).multiply(undoPontiacPreviewRotation);
            }
          });
        }

        scene.add(previewCarModel);
        // 그랜저는 85%, 페라리는 95%로 쇼룸에서만 미세 보정합니다.
        const previewScaleMultiplier =
          modelName === 'GrandeurIG' ? 0.85 :
          modelName === 'SportsCar' ? 0.95 :
          1;
        normalizePreviewCarScale(previewCarModel, previewScaleMultiplier);
        console.log("Preview model added to isolated showroom scene with normalized scale");
      }
    }

    // 단계별 UI 전환 이벤트
    document.getElementById('btnNextStep1').addEventListener('click', () => {
      const nick = document.getElementById('nicknameInput').value.trim();
      if (!nick) {

    document.getElementById('btnPrevStep3').addEventListener('click', () => {

    // 차량 선택 및 외곽 플로팅 컨트롤 이벤트
    const startMenu = document.getElementById('startMenu');
    const compactCarPopup = document.getElementById('compactCarPopup');
    const compactCarName = document.getElementById('compactCarName');
    const vehicleNameBar = document.getElementById('vehicleNameBar');
    const vehicleNameBarText = document.getElementById('vehicleNameBarText');
    const liveColorPicker = document.getElementById('liveColorPicker');
    const liveColorInput = document.getElementById('liveColorInput');
    const liveColorHex = document.getElementById('liveColorHex');
    const liveStartButton = document.getElementById('liveStartButton');
    const currentCarButton = document.getElementById('currentCarButton');
    const carOptionsPanel = document.getElementById('carOptionsPanel');
    const currentCarName = document.getElementById('currentCarName');

    function setFloatingControlsVisible(isVisible) {
      vehicleNameBar.classList.toggle('is-visible', isVisible);
      liveColorPicker.classList.toggle('is-visible', isVisible);
    }

    function setShowroomMenuCompact(isCompact) {
      if (isCompact) {
        const selectedName = currentCarName.textContent;
        compactCarName.textContent = selectedName;
        vehicleNameBarText.textContent = selectedName;

        currentCarButton.setAttribute('aria-expanded', 'false');
        // 중앙 메뉴는 숨기고 외곽 플로팅 컨트롤만 표시합니다.
        startMenu.classList.remove('start-menu-compact');
        startMenu.style.display = 'none';
        setFloatingControlsVisible(true);
      } else {
        startMenu.style.display = 'block';
        startMenu.classList.remove('start-menu-compact');

    function openVehicleSelector() {
      setShowroomMenuCompact(false);
      document.getElementById('step2').style.display = 'block';
      document.getElementById('step3').style.display = 'none';
      carOptionsPanel.removeAttribute('hidden');

    }

    // 상단의 차량명 바를 누르면 중앙 차량 목록을 다시 엽니다.
    vehicleNameBar.addEventListener('click', (e) => {
      e.stopPropagation();
      openVehicleSelector();
    });

    // 이전 버전의 컴팩트 버튼도 호환 처리합니다.
    compactCarPopup.addEventListener('click', (e) => {
      e.stopPropagation();
      openVehicleSelector();
    });

    currentCarButton.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = carOptionsPanel.hasAttribute('hidden');
      if (isHidden) {
        carOptionsPanel.removeAttribute('hidden');
        currentCarButton.classList.add('is-open');
        currentCarButton.setAttribute('aria-expanded', 'true');
      } else {
        carOptionsPanel.setAttribute('hidden', '');
        currentCarButton.classList.remove('is-open');
        currentCarButton.setAttribute('aria-expanded', 'false');
      }
    });

    // 메뉴 바깥 클릭 시 닫기
    document.addEventListener('click', (e) => {
      if (!currentCarButton.contains(e.target) && !carOptionsPanel.contains(e.target)) {
        carOptionsPanel.setAttribute('hidden', '');
        currentCarButton.classList.remove('is-open');
        currentCarButton.setAttribute('aria-expanded', 'false');
      }
    });

    // 차량 옵션 버튼 클릭 이벤트
    document.querySelectorAll('.car-option-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        document.querySelectorAll('.car-option-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        selectedCarModelName = e.target.getAttribute('data-model');
        currentCarName.textContent = e.target.textContent;
        compactCarName.textContent = e.target.textContent;
        vehicleNameBarText.textContent = e.target.textContent;
        
        // 차량을 선택하면 중앙 메뉴는 사라지고 상단 차량명/좌상단 색상만 남깁니다.
        setShowroomMenuCompact(true);
        await initPreviewCar(selectedCarModelName, selectedCarColor);
      });
    });

    // 컬러 피커 변경 이벤트 (좌상단/Step 3 모두 즉시 실시간 반영)
    const colorInput = document.getElementById('colorInput');
    const colorHexDisplay = document.getElementById('colorHexDisplay');

    function applyPreviewColor(nextColor) {
      selectedCarColor = nextColor;
      colorInput.value = selectedCarColor;
      liveColorInput.value = selectedCarColor;
      colorHexDisplay.textContent = selectedCarColor.toUpperCase();
      liveColorHex.textContent = selectedCarColor.toUpperCase();

      if (previewCarModel) {
        previewCarModel.traverse(child => {
          if (child.isMesh && child.material) {
            const matName = (child.material.name || '').toLowerCase();
            const meshName = (child.name || '').toLowerCase();
            // 차체, 페인트 재질, 또는 MainBody 메쉬인 경우 즉시 색상 변경
            if (meshName === 'mainbody' || meshName === 'body' || matName.includes('body') || matName.includes('paint') || matName.includes('.036')) {
              if (!child.material.color) {
                child.material = child.material.clone();
              }
              child.material.color.set(selectedCarColor);
              child.material.needsUpdate = true;
            }
          }
        });
      }
    }

    colorInput.addEventListener('input', (e) => applyPreviewColor(e.target.value));
    liveColorInput.addEventListener('input', (e) => applyPreviewColor(e.target.value));

    // 좌상단 패널에서도 바로 주행을 시작할 수 있도록 기존 시작 버튼과 연결합니다.
    liveStartButton.addEventListener('click', (e) => {

      document.getElementById('startButton').click();

    // 게임 시작 버튼
    document.getElementById('startButton').addEventListener('click', async () => {
      const nickname = document.getElementById('nicknameInput').value.trim();
      if (!nickname) {
        alert('닉네임을 입력하세요!');

      if (previewCarModel) {

        previewCarModel = null;

      document.getElementById('startMenu').style.display = 'none';
      setFloatingControlsVisible(false);
      startGame(selectedCarModelName, selectedCarColor, nickname);

    async function startGame(modelName = 'GrandeurIG', color = '#ffffff', nickname) {
  currentCarModel = modelName;
  socket.emit('joinGame', {
    nickname: nickname,
    carModel: modelName,
    carColor: color
  });

  switch (modelName) {
    case 'GrandeurIG':
      carModel = createGrandeurIGCarDetailed(color); // 동기, await 불필요
      break;
    case 'SportsCar':
      carModel = await createSportsCar(color); // ← await 필수
      break;
    case 'SUV':
      carModel = await createSUVCar(color); 
      break;
    case 'McLarenP1':
      carModel = await createMcLarenP1(color);
      break;
    case 'PontiacPhoenix':
      carModel = await createPontiacPhoenix(color);
      break;
    case 'DodgeDemon':
      carModel = await createDodgeDemon(color);
      break;
    default:
      carModel = createGrandeurIGCarDetailed(color);
  }

  scene.add(carModel);
  // carModel.userData.wheelNodes가 이미 설정되어 있다면 전역 변수 carWheelNodes를 업데이트합니다.
  if (carModel.userData.wheelNodes) {
    carWheelNodes = carModel.userData.wheelNodes;
  } else {
    carModel.userData.wheelNodes = carWheelNodes;
  }
  carModel.userData.modelName = currentCarModel;
  wheelHolders.forEach(h => scene.add(h));
  carModel.userData.steeringNode = steeringWheelNode;

  // 물리 바디 보간용 초기값 설정
  chassisBody.previousPosition = new THREE.Vector3(chassisBody.position.x, chassisBody.position.y, chassisBody.position.z);
  chassisBody.previousQuaternion = new THREE.Quaternion(chassisBody.quaternion.x, chassisBody.quaternion.y, chassisBody.quaternion.z, chassisBody.quaternion.w);

  startTimer();
  updateGearDisplay();
}
