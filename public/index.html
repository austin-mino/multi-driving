<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>multi driving</title>
          <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');
    
    body {
      margin: 0;
      overflow: hidden;
      background: #0a0c10;
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      user-select: none;
    }
    
    #rotateWarning {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 12, 16, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px 50px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 1000;
      display: none;
      text-align: center;
    }

    /* 하이엔드 다크 모드 HUD */
    #hudContainer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }

    #hud {
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 24px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      min-width: 120px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    #gearDisplay {
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #3b82f6; /* 차분한 블루 액센트 */
      min-width: 50px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    #timerDisplay {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 28, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 20px;
      border-radius: 30px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #94a3b8;
      z-index: 100;
    }

    #controlsLeft {
      position: fixed;
      bottom: 35px;
      left: 35px;
      display: flex;
      gap: 15px;
      z-index: 110;
    }

    #driveControls {
      position: fixed;
      bottom: 35px;
      right: 35px;
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      gap: 15px;
      z-index: 110;
    }
    
    .drive-main-btns {
      display: flex;
      gap: 15px;
    }

    #gearControls {
      position: fixed;
      top: 25px;
      right: 25px;
      display: flex;
      gap: 6px;
      z-index: 100;
    }

    button.controlBtn {
      padding: 18px 28px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button.controlBtn:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(255, 255, 255, 0.2);
    }

    button.controlBtn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.1);
    }

    #gearControls button.controlBtn {
      padding: 8px 14px;
      font-size: 13px;
      background: transparent;
      border-color: rgba(255, 255, 255, 0.1);
      color: #64748b;
    }
    
    #gearControls button.controlBtn.active-gear {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #3b82f6;
    }

    #btnReset.controlBtn {
      padding: 10px 18px;
      font-size: 13px;
      background: rgba(220, 38, 38, 0.1);
      border-color: rgba(220, 38, 38, 0.2);
      color: #ef4444;
    }

    #btnToggleCam {
      position: fixed;
      top: 75px;
      right: 25px;
      padding: 6px 14px;
      font-size: 11px;
      background: transparent;
      color: #64748b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      z-index: 100;
    }

    #startMenu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 12px;
      z-index: 2000;
      width: 340px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    #startMenu h2 { font-weight: 800; color: #fff; margin-bottom: 30px; text-align: center; }
    #startMenu label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; font-weight: 600; }
    #startMenu input, #startMenu select { width: 100%; padding: 12px; margin-bottom: 20px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
    #startButton { width: 100%; padding: 16px; background: #3b82f6; color: #fff; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    #startButton:hover { background: #2563eb; }
    
    #adminPanel {
      position: fixed;
      top: 25px;
      left: 25px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      z-index: 200;
      display: none;
      width: 300px;
      box-sizing: border-box;
    }

    #adminPanel h3 {
      margin: 0 0 14px;
      font-size: 15px;
      white-space: nowrap;
    }

    #adminPanel .admin-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 28px;
      margin-bottom: 8px;
    }

    #adminPanel .admin-row label {
      flex: 0 0 132px;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #cbd5e1;
      font-size: 11px;
      line-height: 1.2;
    }

    #adminPanel .admin-row label span {
      display: inline-block;
      min-width: 24px;
      text-align: right;
    }

    #adminPanel .admin-row input[type="range"] {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      margin: 0;
      display: block;
    }

      /* 쇼룸 시작 메뉴 스타일 */
    #startMenu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8, 12, 20, 0.94);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 28px 32px;
      border-radius: 16px;
      z-index: 2000;
      width: 400px;
      box-sizing: border-box;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.58), 0 0 0 1px rgba(59, 130, 246, 0.06);
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      transition: top 0.28s ease, left 0.28s ease, right 0.28s ease, transform 0.28s ease, width 0.28s ease, padding 0.28s ease, border-radius 0.28s ease;
    }

    #startMenu.start-menu-compact {
      top: 24px;
      right: 24px;
      left: auto;
      transform: none;
      width: 188px;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(8, 12, 20, 0.78);
      border-color: rgba(96, 165, 250, 0.32);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.38);
    }

    #startMenu.start-menu-compact .showroom-step {
      display: none !important;
    }

    #compactCarPopup {
      display: none;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 30px;
      padding: 2px 3px;
      box-sizing: border-box;
      border: 0;
      background: transparent;
      color: #e2e8f0;
      cursor: pointer;
      text-align: left;
    }

    #startMenu.start-menu-compact #compactCarPopup {
      display: flex;
    }

    #compactCarPopup:hover #compactCarName {
      color: #93c5fd;
    }

    #compactCarPopup .compact-car-caption {
      color: #64748b;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    #compactCarName {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
      transition: color 0.18s ease;
    }

    #compactCarPopup .compact-car-arrow {
      color: #60a5fa;
      font-size: 14px;
      line-height: 1;
    }

    #startMenu:not(.start-menu-compact) .showroom-step h2 {
      margin-bottom: 9px;
      font-size: 20px;
    }

    #startMenu:not(.start-menu-compact) .step-desc {
      margin-bottom: 18px;
      font-size: 12px;
    }

    #startMenu:not(.start-menu-compact) #nicknameInput {
      padding: 14px 16px;
      margin-bottom: 18px;
      font-size: 16px;
    }

    #startMenu:not(.start-menu-compact) .current-car-button {
      padding: 13px 15px;
    }

    #startMenu:not(.start-menu-compact) #currentCarName {
      font-size: 16px;
    }

    #startMenu:not(.start-menu-compact) .car-options-panel {
      padding: 10px;
      top: calc(100% + 8px);
    }

    #startMenu:not(.start-menu-compact) .car-select-grid {
      gap: 8px;
    }

    #startMenu:not(.start-menu-compact) .car-option-btn {
      padding: 12px 8px;
      font-size: 13px;
    }

    #startMenu:not(.start-menu-compact) .color-picker-wrapper {
      gap: 14px;
      padding: 14px;
    }

    #startMenu:not(.start-menu-compact) #colorInput {
      width: 58px;
      height: 42px;
      padding: 0;
      margin: 0;
    }

    #startMenu:not(.start-menu-compact) #colorHexDisplay {
      font-size: 15px;
    }

    #startMenu:not(.start-menu-compact) .showroom-btn,
    #startMenu:not(.start-menu-compact) .showroom-btn-sec {
      padding-top: 12px;
      padding-bottom: 12px;
      font-size: 13px;
    }
    .showroom-step h2 {
      margin: 0 0 4px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #fff;
      text-align: center;
    }
    .step-desc {
      margin: 0 0 10px 0;
      font-size: 9px;
      color: #94a3b8;
      text-align: center;
    }
    #nicknameInput {
      width: 100%;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }
    #nicknameInput:focus {
      border-color: #3b82f6;
    }
    .vehicle-select-control {
      position: relative;
      margin-bottom: 10px;
    }
    .current-car-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 4px 7px;
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #f8fafc;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .current-car-button:hover,
    .current-car-button.is-open {
      background: rgba(51, 65, 85, 0.9);
      border-color: #3b82f6;
    }
    #currentCarName {
      color: #e2e8f0;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
    }
    .current-car-label,
    .current-car-chevron {
      display: none;
    }
    .car-options-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 5px);
      padding: 5px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }
    .car-options-panel[hidden] {
      display: none;
    }
    .car-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .car-option-btn {
      padding: 6px 4px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .car-option-btn:hover {
      background: rgba(51, 65, 85, 0.8);
      color: #fff;
    }
    .car-option-btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
      color: #3b82f6;
    }
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      background: rgba(30, 41, 59, 0.4);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #colorInput {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 20px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }
    #colorInput::-webkit-color-swatch-wrapper { padding: 0; }
    #colorInput::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; }
    #colorHexDisplay {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .showroom-btn {
      width: 100%;
      padding: 7px 8px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .showroom-btn:hover { background: #2563eb; }
    .showroom-nav-btns {
      display: flex;
      gap: 5px;
    }
    .showroom-btn-sec {
      width: 40%;
      padding: 7px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #94a3b8;
      font-weight: 600;
      font-size: 10px;
      cursor: pointer;
    }
    .showroom-btn-sec:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .showroom-nav-btns .showroom-btn { width: 60%; }

    /* 차량 선택 후 화면 가장자리에서만 보이는 플로팅 컨트롤 */
    #vehicleNameBar {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      width: 164px;
      min-height: 30px;
      padding: 5px 9px;
      box-sizing: border-box;
      background: rgba(15, 20, 28, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 20px;
      color: #f8fafc;
      cursor: pointer;
      z-index: 2100;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
    }

    #vehicleNameBar.is-visible {
      display: flex;
    }

    #vehicleNameBar:hover {
      border-color: rgba(96, 165, 250, 0.72);
      background: rgba(20, 30, 44, 0.88);
    }

    #vehicleNameBar .vehicle-bar-label {
      color: #64748b;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    #vehicleNameBarText {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-align: center;
    }

    #vehicleNameBar .vehicle-bar-arrow {
      color: #60a5fa;
      font-size: 13px;
      line-height: 1;
    }

    #liveColorPicker {
      position: fixed;
      top: 24px;
      left: 24px;
      display: none;
      flex-direction: column;
      gap: 14px;
      width: 250px;
      padding: 20px;
      box-sizing: border-box;
      background: rgba(15, 20, 28, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(96, 165, 250, 0.45);
      border-radius: 14px;
      z-index: 2100;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
    }

    #liveColorPicker.is-visible {
      display: flex;
    }

    .live-color-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    #liveColorHex {
      color: #3b82f6;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .live-color-control {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    #liveColorInput {
      width: 64px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }

    #liveColorInput::-webkit-color-swatch-wrapper { padding: 0; }
    #liveColorInput::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; }

    .live-color-help {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    #liveStartButton {
      width: 100%;
      padding: 12px 10px;
      margin-top: 5px;
      border: 1px solid rgba(96, 165, 250, 0.5);
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.3);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #liveStartButton:hover { 
      background: #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
      transform: translateY(-1px);
    }

  </style>

<body>
  <!-- 3단계 시네마틱 쇼룸 시작 메뉴 -->
  <div id="startMenu">
    <!-- Step 1: 닉네임 입력 -->
    <div id="step1" class="showroom-step">
      <h2>DRIVER SETUP</h2>
      <p class="step-desc">드라이버 닉네임을 입력하세요</p>
      <input type="text" id="nicknameInput" placeholder="ENTER NICKNAME" autocomplete="off" />
      <button id="btnNextStep1" class="showroom-btn">NEXT STEP</button>
    </div>

    <!-- Step 2: 차량 선택 및 360 미리보기 -->
    <div id="step2" class="showroom-step" style="display:none;">
      <h2>VEHICLE SHOWROOM</h2>
      <p class="step-desc">차량을 선택하면 360도 미리보기가 제공됩니다</p>
      <div class="vehicle-select-control">
        <button id="currentCarButton" class="current-car-button" type="button" aria-expanded="false" aria-controls="carOptionsPanel">
          <strong id="currentCarName">Ferrari 458</strong>
        </button>
        <div id="carOptionsPanel" class="car-options-panel" hidden>
          <div class="car-select-grid">
            <button class="car-option-btn active" type="button" data-model="SportsCar">Ferrari 458</button>
            <button class="car-option-btn" type="button" data-model="DodgeDemon">Dodge Challenger SRT Demon</button>
            <button class="car-option-btn" type="button" data-model="SUV">Range Rover</button>
            <button class="car-option-btn" type="button" data-model="McLarenP1">McLaren P1</button>
            <button class="car-option-btn" type="button" data-model="PontiacPhoenix">Pontiac Phoenix</button>
            <button class="car-option-btn" type="button" data-model="GrandeurIG">Grandeur Sedan</button>
          </div>
        </div>
      </div>
      <div class="showroom-nav-btns">
        <button id="btnPrevStep2" class="showroom-btn-sec">BACK</button>
        <button id="btnNextStep2" class="showroom-btn">COLOR CONFIG</button>
      </div>

function onPointerDown(event) {

    camAzimuthStart = camAzimuth;

function onPointerMove(event) {

    const rotationSpeed = 0.05;

    camAzimuth = camAzimuthStart - deltaX * rotationSpeed;
    camElevation = camElevationStart - deltaY * rotationSpeed;

    camElevation = Math.min(Math.max(camElevation, 0.1), Math.PI - 0.1);
  }

  chassisBody.quaternion.setFromEuler(0, yRot, 0);

// 쿼터니언에서 y축 회전값 추출
function getYRotation(q) {
  const siny_cosp = 2 * (q.w * q.y + q.z * q.x);
  const cosy_cosp = 1 - 2 * (q.y * q.y + q.z * q.z);
  return Math.atan2(siny_cosp, cosy_cosp);
}

function createShowroomExhibition() {
  const exhibition = new THREE.Group();
  exhibition.name = 'ShowroomExhibition';
  exhibition.position.copy(SHOWROOM_CENTER);

  // 반사율이 높은 바닥과 차분한 벽면으로 차량 실루엣이 돋보이게 구성합니다.
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x0b111b,
    metalness: 0.86,
    roughness: 0.20
  });
  const stageMat = new THREE.MeshStandardMaterial({
    color: 0x26394f,
    metalness: 0.78,
    roughness: 0.18
  });
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x101a29,
    metalness: 0.34,
    roughness: 0.58
  });
  const panelMat = new THREE.MeshStandardMaterial({
    color: 0x17273a,
    metalness: 0.48,
    roughness: 0.38
  });
  const trimMat = new THREE.MeshStandardMaterial({
    color: 0x477da9,
    emissive: 0x0b2d4d,
    emissiveIntensity: 0.42,
    metalness: 0.35,
    roughness: 0.30
  });
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x4d9ed0,
    transparent: true,
    opacity: 0.62,
    depthWrite: false
  });

  // 넓은 반사 바닥
  const floor = new THREE.Mesh(new THREE.BoxGeometry(32, 0.18, 28), floorMat);
  floor.position.set(0, -3.48, 0);
  floor.receiveShadow = true;
  exhibition.add(floor);

  // 차량을 띄워 보여주는 이중 원형 단상
  const platformBase = new THREE.Mesh(new THREE.CylinderGeometry(8.25, 8.5, 0.38, 96), stageMat);
  platformBase.position.y = -3.06;
  platformBase.castShadow = true;
  platformBase.receiveShadow = true;
  exhibition.add(platformBase);

  const platformTop = new THREE.Mesh(new THREE.CylinderGeometry(7.9, 8.0, 0.16, 96), new THREE.MeshStandardMaterial({
    color: 0x344e68,
    metalness: 0.86,
    roughness: 0.14
  }));
  platformTop.position.y = -2.79;
  platformTop.receiveShadow = true;
  exhibition.add(platformTop);

  const outerRing = new THREE.Mesh(new THREE.TorusGeometry(8.05, 0.055, 12, 160), trimMat);
  outerRing.rotation.x = Math.PI / 2;
  outerRing.position.y = -2.57;
  exhibition.add(outerRing);

  const innerRing = new THREE.Mesh(new THREE.TorusGeometry(6.0, 0.025, 8, 128), glowMat);
  innerRing.rotation.x = Math.PI / 2;
  innerRing.position.y = -2.57;
  exhibition.add(innerRing);

  // 바닥 그리드: 빈 공간을 줄이고 전시장 깊이감을 만듭니다.
  const gridMat = new THREE.MeshBasicMaterial({
    color: 0x284968,
    transparent: true,
    opacity: 0.34,
    depthWrite: false
  });
  for (let x = -14; x <= 14; x += 2) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.012, 26), gridMat);
    line.position.set(x, -3.37, 0);
    exhibition.add(line);
  }
  for (let z = -12; z <= 12; z += 2) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(30, 0.012, 0.018), gridMat);
    line.position.set(0, -3.36, z);
    exhibition.add(line);
  }

  // 후면 벽과 깊이감 있는 중앙 패널
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(30, 14, 0.42), wallMat);
  backWall.position.set(0, 3.4, -13.0);
  backWall.receiveShadow = true;
  exhibition.add(backWall);

  const backPanel = new THREE.Mesh(new THREE.BoxGeometry(19, 9.2, 0.10), panelMat);
  backPanel.position.set(0, 3.1, -12.72);
  exhibition.add(backPanel);

  // 대형 수직 라이트 바와 벽면 프레임
  for (const x of [-12.0, -9.0, -6.0, 6.0, 9.0, 12.0]) {
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.075, 9.8, 0.05), glowMat);
    strip.position.set(x, 3.2, -12.62);
    exhibition.add(strip);
  }

  const frameTop = new THREE.Mesh(new THREE.BoxGeometry(24, 0.08, 0.06), trimMat);
  frameTop.position.set(0, 7.95, -12.60);
  exhibition.add(frameTop);
  const frameBottom = frameTop.clone();
  frameBottom.position.y = -1.25;
  exhibition.add(frameBottom);

  // 카메라를 향한 후면 헤일로 링
  const haloOuter = new THREE.Mesh(new THREE.TorusGeometry(5.3, 0.10, 16, 128), trimMat);
  haloOuter.position.set(0, 2.7, -12.45);
  exhibition.add(haloOuter);
  const haloInner = new THREE.Mesh(new THREE.TorusGeometry(4.75, 0.025, 10, 128), glowMat);
  haloInner.position.set(0, 2.7, -12.40);
  exhibition.add(haloInner);

  // 양쪽의 수직 기둥과 상부 브리지
  for (const x of [-13.7, 13.7]) {
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.36, 12, 0.42), panelMat);
    pillar.position.set(x, 2.4, -10.7);
    pillar.castShadow = true;
    exhibition.add(pillar);
    const pillarLight = new THREE.Mesh(new THREE.BoxGeometry(0.055, 8.2, 0.055), glowMat);
    pillarLight.position.set(x * 0.995, 2.4, -10.45);
    exhibition.add(pillarLight);
  }
  const ceilingBridge = new THREE.Mesh(new THREE.BoxGeometry(28, 0.35, 0.42), panelMat);
  ceilingBridge.position.set(0, 8.4, -10.7);
  exhibition.add(ceilingBridge);

  // 상부 헤일로 조명 프레임과 차량 주변의 은은한 광원 빔
  const overheadHalo = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.045, 10, 128), trimMat);
  overheadHalo.rotation.x = Math.PI / 2;
  overheadHalo.position.set(0, 7.8, -0.2);
  exhibition.add(overheadHalo);

  const beamMat = new THREE.MeshBasicMaterial({
    color: 0x5ea8d7,
    transparent: true,
    opacity: 0.035,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  for (const x of [-5.2, 5.2]) {
    const beam = new THREE.Mesh(new THREE.ConeGeometry(1.7, 7.0, 32, 1, true), beamMat);
    beam.position.set(x, 3.7, 0.4);
    exhibition.add(beam);
  }

  // 전시장에 떠 있는 미세 입자
  const particlePositions = [];
  for (let i = 0; i < 90; i++) {
    const angle = i * 2.39996;
    const radius = 5.5 + (i % 9) * 0.65;
    particlePositions.push(
      Math.cos(angle) * radius,
      -1.8 + (i % 18) * 0.55,
      -5.5 + Math.sin(angle) * 2.8
    );
  }
  const particleGeometry = new THREE.BufferGeometry();
  particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particlePositions, 3));
  const particles = new THREE.Points(particleGeometry, new THREE.PointsMaterial({
    color: 0x70b9e2,
    size: 0.055,
    transparent: true,
    opacity: 0.42,
    depthWrite: false
  }));
  exhibition.add(particles);
  exhibition.userData.particles = particles;

  exhibition.visible = false;
  scene.add(exhibition);
  return exhibition;
}

function makeAsphaltTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#111111';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4000; i++) {
  const v = 12 + Math.random() * 10 | 0;
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(60, 60);
  return t;
}

function makeSidewalkTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#888888';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#707070';
  ctx.lineWidth = 1.5;
  for (let i = 0; i <= 128; i += 16) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 128); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(128, i); ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(5, 5);
  return t;
}

function makeBuildingTexture(hexColor, floors = 10, cols = 5) {
  const w = 256, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const r = (hexColor >> 16) & 0xff;
  const g = (hexColor >> 8) & 0xff;
  const b = hexColor & 0xff;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, w, h);
  const fh = h / floors, cw = w / cols;
  for (let f = 0; f < floors; f++) {
    for (let col = 0; col < cols; col++) {
      const lit = Math.random() > 0.28;
      ctx.fillStyle = lit ? 'rgba(255,240,160,0.92)' : 'rgba(15,25,45,0.88)';
      ctx.fillRect(col * cw + cw * 0.12, f * fh + fh * 0.12, cw * 0.76, fh * 0.58);
      // 창문 테두리
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(col * cw + cw * 0.12, f * fh + fh * 0.12, cw * 0.76, fh * 0.58);
    }
  }
  return new THREE.CanvasTexture(c);
}

// ─── 횡단보도 ──────────────────────────────────────────────
function addCrosswalk(x, z) {
  const half = BLOCK_SIZE / 2;
  const stripeW = 1.6;
  const stripeLen = ROAD_WIDTH * 0.85;
  const count = 5;
  const totalW = count * stripeW * 2;
  const startOff = -totalW / 2 + stripeW / 2;

  for (let i = 0; i < count; i++) {
    const off = startOff + i * stripeW * 2;
    // 위쪽 횡단보도
    const s1 = new THREE.Mesh(new THREE.BoxGeometry(stripeW, 0.02, stripeLen), laneMat);
    s1.position.set(x + off, -4.96, z - half + stripeLen / 2 + 1);
    roadGroup.add(s1);
    // 아래쪽 횡단보도
    const s2 = s1.clone();
    s2.position.z = z + half - stripeLen / 2 - 1;
    roadGroup.add(s2);
    // 왼쪽 횡단보도
    const s3 = new THREE.Mesh(new THREE.BoxGeometry(stripeLen, 0.02, stripeW), laneMat);
    s3.position.set(x - half + stripeLen / 2 + 1, -4.96, z + off);
    roadGroup.add(s3);
    // 오른쪽 횡단보도
    const s4 = s3.clone();
    s4.position.x = x + half - stripeLen / 2 - 1;
    roadGroup.add(s4);
  }
}

function createBuilding(x, z) {
  const maxArea = BLOCK_SIZE - ROAD_WIDTH - 6;
  const distFromCenter = Math.sqrt(x*x + z*z);
  const isDowntown = distFromCenter < 160;
  
  const w = 20 + rng() * (maxArea - 20);
  const d = 20 + rng() * (maxArea - 20);
  // 실제 도시 형태: 중심부는 고층 스카이라인(최대 220m), 외곽은 중·저층 건물
  const h = isDowntown ? (70 + rng() * 150) : (20 + rng() * 60);
  const baseColor = buildingPalette[Math.floor(rng() * buildingPalette.length)];

  const buildingTexPool = buildingPalette.map(color =>
    makeBuildingTexture(color, isDowntown ? 14 : 8, isDowntown ? 6 : 4)
  );
  const tex = buildingTexPool[Math.floor(rng() * buildingTexPool.length)];
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ 
    map: tex, 
    roughness: isDowntown ? 0.2 : 0.75, 
    metalness: isDowntown ? 0.6 : 0.1 
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, -5 + h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  buildingGroup.add(mesh);

  // 옥상 디테일
  addRooftop(x, z, w, d, h);

  // 물리
  const body = new CANNON.Body({ mass: 0 });
  body.addShape(new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)));
  body.position.set(x, -5 + h / 2, z);
  world.addBody(body);

  addStreetProps(x, z, w, d);
}

// ─── 옥상 디테일 ───────────────────────────────────────────
function addRooftop(x, z, w, d, h) {
  const roofY = -5 + h;
  const grayMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });

  // 에어컨 실외기
  for (let i = 0; i < 2 + Math.floor(rng() * 3); i++) {
    const ac = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 1.2), grayMat);
    ac.position.set(x + (rng() - 0.5) * w * 0.7, roofY + 0.4, z + (rng() - 0.5) * d * 0.7);
    buildingGroup.add(ac);
  }

  // 계단실
  if (rng() > 0.5) {
    const stair = new THREE.Mesh(
      new THREE.BoxGeometry(4 + rng() * 3, 3 + rng() * 2, 4 + rng() * 3),
      new THREE.MeshStandardMaterial({ color: 0x707070, roughness: 0.9 })
    );
    stair.position.set(x + (rng() - 0.5) * w * 0.5, roofY + 1.5, z + (rng() - 0.5) * d * 0.5);
    buildingGroup.add(stair);
  }

  // 물탱크
  if (rng() > 0.65) {
    const tankMat = new THREE.MeshStandardMaterial({ color: 0x8b6010, roughness: 0.7 });
    const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 2.5, 10), tankMat);
    const tx = x + (rng() - 0.5) * w * 0.5;
    const tz = z + (rng() - 0.5) * d * 0.5;
    tank.position.set(tx, roofY + 1.25, tz);
    buildingGroup.add(tank);
    // 지지대
    const legMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.8, 4), legMat);
      leg.position.set(tx + Math.cos(a) * 0.9, roofY + 0.6, tz + Math.sin(a) * 0.9);
      buildingGroup.add(leg);
    }
  }
}

  // Dodge GLB의 desirefx.me_077_43에는 각 재질 파츠별로 네 바퀴가 하나의 Mesh에
  // 묶여 있다. 원본은 X축이 좌·우, Y축이 앞·뒤, Z축이 위·아래이므로 X/Y 사분면으로
  // 분리해야 한다. Z축으로 나누면 바퀴의 상·하단이 갈라져 독립 회전할 수 없다.
  const DODGE_WHEEL_NAMES = ['Wheel_FL', 'Wheel_FR', 'Wheel_RL', 'Wheel_RR'];
  // 이 HTML과 같은 경로에 전달된 수정 GLB를 둔다.
  const DODGE_GLB_URL = './models/dodge_demon/dodge_challenger_srt_demon_split_wheels.glb';

  // Dodge 전용 표시 보정값. 전장은 기존 8.0에서 약 31% 키워 다른 차량과의
  // 시각적 비율을 맞춘다. GLB는 Z축이 위쪽이고 Y축이 차량 전후축이므로
  // X축 +90도 회전으로 위쪽을 유지하면서 차량의 전방(+Y)을 게임의 전방(+Z)에 맞춘다.
  const DODGE_TARGET_LENGTH = 10.5;
  const DODGE_VISUAL_ROTATION = new THREE.Euler(Math.PI / 2, 0, 0);

  // 원본 통합 휠을 런타임에 정점 단위로 분해하면 material group/draw range가
  // 유실되어 차체 일부가 비어 보일 수 있다. 사전 분리 휠이 없을 때는 원본을
  // 그대로 보존해 차량 외관이 사라지거나 뚫리는 현상을 막는다.
  const DODGE_PRESERVE_COMBINED_WHEELS = true;

  function getDodgeWheelSlot(x, y, midX, midY) {
    const isLeft = x < midX;
    const isFront = y >= midY;
    if (isFront) return isLeft ? 0 : 1; // FL / FR
    return isLeft ? 2 : 3;              // RL / RR
  }

  function splitDodgeMeshIntoFour(mesh) {
    const src = mesh.geometry;
    if (!src || !src.attributes.position) return [null, null, null, null];

    src.computeBoundingBox();
    const box = src.boundingBox;
    const midX = (box.min.x + box.max.x) * 0.5;
    const midY = (box.min.y + box.max.y) * 0.5;
    const position = src.attributes.position;
    const index = src.index;
    const buckets = [[], [], [], []];
    const triangleCount = index ? index.count / 3 : position.count / 3;

    for (let triangle = 0; triangle < triangleCount; triangle++) {
      const vertexIds = index
        ? [index.getX(triangle * 3), index.getX(triangle * 3 + 1), index.getX(triangle * 3 + 2)]
        : [triangle * 3, triangle * 3 + 1, triangle * 3 + 2];
      const centerX = (position.getX(vertexIds[0]) + position.getX(vertexIds[1]) + position.getX(vertexIds[2])) / 3;
      const centerY = (position.getY(vertexIds[0]) + position.getY(vertexIds[1]) + position.getY(vertexIds[2])) / 3;
      buckets[getDodgeWheelSlot(centerX, centerY, midX, midY)].push(vertexIds);
    }

    const attributeNames = Object.keys(src.attributes);
    return buckets.map((triangles) => {
      if (!triangles.length) return null;

      const vertexMap = new Map();
      const vertices = [];
      triangles.flat().forEach((oldIndex) => {
        if (!vertexMap.has(oldIndex)) {
          vertexMap.set(oldIndex, vertices.length);
          vertices.push(oldIndex);
        }
      });

      const geometry = new THREE.BufferGeometry();
      attributeNames.forEach((name) => {
        const attribute = src.attributes[name];
        const array = new attribute.array.constructor(vertices.length * attribute.itemSize);
        vertices.forEach((oldIndex, newIndex) => {
          for (let component = 0; component < attribute.itemSize; component++) {
            array[newIndex * attribute.itemSize + component] = attribute.array[oldIndex * attribute.itemSize + component];
          }
        });
        geometry.setAttribute(name, new THREE.BufferAttribute(array, attribute.itemSize, attribute.normalized));
      });
      geometry.setIndex(triangles.flatMap((triangle) => triangle.map((oldIndex) => vertexMap.get(oldIndex))));
      geometry.computeBoundingBox();
      geometry.computeBoundingSphere();
      return geometry;
    });
  }

  function makeDodgeComponentMesh(sourceMesh, geometry) {
    const material = Array.isArray(sourceMesh.material)
      ? sourceMesh.material.map((m) => m?.clone ? m.clone() : m)
      : (sourceMesh.material?.clone ? sourceMesh.material.clone() : sourceMesh.material);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  // 커브 시 속도 떨어지면 RPM도 살짝 내려옴
  // 고단에서 RPM 끌어올리는 부작용 최소화 (0.02)
  const wheelRadius = 0.65;
  const wheelCircumference = 2 * Math.PI * wheelRadius;
  const wheelRPM = (speed / 3.6) / wheelCircumference * 60;
  const speedBasedRPM = wheelRPM * gearRatios[currentGear] * finalDrive;

  // 핸드브레이크 중이면 속도 반영 완전히 끊음 (드리프트 중 RPM 독립)
  const blend = input.handbrake ? 0.08 : 0.02;
  rpm = rpm * (1 - blend) + speedBasedRPM * blend;

  return Math.max(idleRPM, Math.min(rpm, maxRPM));
}
  
function updateGearAuto(delta) {
  if (isShifting) {
    shiftTimer -= delta;
    if (shiftTimer <= 0) isShifting = false;
    return;
  }

  // 업시프트: RPM이 한계에 도달하면 다음 기어로
  if (input.accel && rpm >= shiftUpRPM && currentGear < maxGear) {
    currentGear++;
    rpm *= 0.62; // 업시프트 시 RPM 드롭
    isShifting = true;
    shiftTimer = shiftDelay;
  }

  // 다운시프트: 가속 없고 RPM 낮으면
  if (!input.accel && rpm < shiftDownRPM && currentGear > 1) {
    currentGear--;
    rpm *= 1.35; // 다운시프트 시 RPM 약간 올라감
    isShifting = true;
    shiftTimer = shiftDelay * 0.5;
  }
}
    // 차량 조향, 가속, 브레이크 처리
function updateVehicleControls(delta) {

 const speed = getSpeedKmH();

  // 조향
  const steerSpeed = 0.004;
  const returnSpeed = 0.016;

  if (input.left) {
    steeringValue = Math.max(steeringValue - steerSpeed, -maxSteerVal);
  } else if (input.right) {
    steeringValue = Math.min(steeringValue + steerSpeed, maxSteerVal);
  } else {
  if (steeringValue > 0)
    steeringValue = Math.max(steeringValue - returnSpeed, 0);

  else if (steeringValue < 0)
    steeringValue = Math.min(steeringValue + returnSpeed, 0);
}

  vehicle.setSteeringValue(steeringValue, 0);
  vehicle.setSteeringValue(steeringValue, 1);
  vehicle.setSteeringValue(0, 2);
  vehicle.setSteeringValue(0, 3);

  // 엔진 힘 초기화
engineForce = 0;

// 기어별 처리
  if (gearState === 'D') {
  rpm = calculateRPM(speed, delta);
  updateGearAuto(delta);

  if (input.accel && !isShifting) {
    const rpmFactor = rpm / maxRPM;

    let torqueCurve;
    if (rpmFactor < 0.25) {
      torqueCurve = 0.4 + rpmFactor * 2.4;
    } else if (rpmFactor < 0.75) {
      torqueCurve = 1.0;
    } else {
      torqueCurve = 1.0 - (rpmFactor - 0.75) * 1.2;
    }

const gearRatio = gearRatios[currentGear] * finalDrive;
const torque = maxEngineForce * torqueCurve / gearRatios[currentGear];
engineForce = Math.min(torque, maxEngineForce * 0.9);

const drag = airDrag * speed * speed;

engineForce -= drag;
engineForce = Math.max(-maxEngineForce * 2, Math.min(engineForce, maxEngineForce * 3));

  } else if (isShifting) {
    engineForce = 0;
  }

  applyBrake(input.brake ? maxBrakeForce : 0);
}
else if (gearState === 'R') {
  if (input.accel) engineForce = -maxEngineForce * 0.6;
  if (input.brake) applyBrake(maxBrakeForce);
  else applyBrake(0);

} else if (gearState === 'N') {
  applyBrake(input.brake ? maxBrakeForce : 0);

} else if (gearState === 'P') {
  applyBrake(maxBrakeForce * 1.5);
}


// 마지막 (이건 항상 맨 끝)
vehicle.applyEngineForce(engineForce, 2);
vehicle.applyEngineForce(engineForce, 3);

let handbrakeActive = false;

if (input.handbrake) {

    // 카메라 차량 뒤쪽 위치로 고정
   function updateCamera() {
  const carPos = interpolatedCarPosition.clone();
  
  // 1. 기본 오프셋 설정 (차량 뒤쪽 위)
  const offset = new THREE.Vector3(0, 6, 14);
  
  // 2. 조향에 따른 카메라 쏠림 효과 (원심력 표현)
  // steeringValue가 왼쪽(-)이면 카메라는 오른쪽(+)으로 살짝 이동
  const steeringLean = -steeringValue * 5; 
  offset.x += steeringLean;
  
  // 3. 속도에 따른 거리 조절 (속도가 빠르면 카메라가 더 멀어짐)
  const speed = getSpeedKmH();
  const speedFactor = Math.min(speed / 200, 1);
  offset.z += speedFactor * 4;
  offset.y += speedFactor * 1.5;

  offset.applyQuaternion(interpolatedCarQuaternion);
  const targetPos = carPos.clone().add(offset);

  // 4. 부드러운 위치 보간 (너무 딱딱하지 않게)
  camera.position.lerp(targetPos, 0.15);
  
  // 5. 시선 보간 (차량의 약간 앞쪽을 바라보게 하여 더 역동적으로)
  const lookAtOffset = new THREE.Vector3(0, 1, -5);
  lookAtOffset.applyQuaternion(interpolatedCarQuaternion);
  const lookAtTarget = carPos.clone().add(lookAtOffset);
  
  // 현재 카메라가 보고 있는 방향에서 목표 방향으로 부드럽게 회전
  const currentLookAt = new THREE.Vector3();
  camera.getWorldDirection(currentLookAt);
  const targetLookAt = lookAtTarget.clone().sub(camera.position).normalize();
  
  camera.lookAt(lookAtTarget);
}

   function updateFirstPersonCamera() {
  // 차종별 운전석 위치
  let offset;
   if (currentCarModel === 'SUV') {

  } else {
    offset = new THREE.Vector3(-0.85, 2.5, -0.4); // 그랜저 기본
  }


  // 1인칭 흔들림 효과 (G-Force 표현)
  const speed = getSpeedKmH();
  const speedFactor = speed / 100;
  const shake = Math.sin(Date.now() * 0.01) * 0.0021618 * speedFactor;
  offset.y += shake;
  offset.x += -steeringValue * 0.5; // 조향 시 몸이 쏠리는 효과

  offset.applyQuaternion(interpolatedCarQuaternion);
  camera.position.copy(interpolatedCarPosition).add(offset);

  const forward = new THREE.Vector3(0, 0, -1);
  // 시선도 조향 방향으로 살짝 미리 보게 함
  const lookRotation = interpolatedCarQuaternion.clone();
  const steeringQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -steeringValue * 0.3);
  lookRotation.multiply(steeringQuat);
  
  forward.applyQuaternion(lookRotation);

  const lookAt = camera.position.clone().add(forward.multiplyScalar(20));
  camera.lookAt(lookAt);
}

      const nick = document.getElementById('nicknameInput').value.trim();
      if (!nick) {
        alert('닉네임을 입력해주세요!');
        return;
      }
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      startMenu.classList.remove('start-menu-compact');
      startMenu.style.display = 'block';
      setFloatingControlsVisible(false);
      // Step 2 진입 시 미리보기 로드
      initPreviewCar(selectedCarModelName, selectedCarColor);
    });

    document.getElementById('btnPrevStep2').addEventListener('click', () => {
      startMenu.classList.remove('start-menu-compact');
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
    });

    document.getElementById('btnNextStep2').addEventListener('click', () => {
      startMenu.classList.remove('start-menu-compact');
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
      setFloatingControlsVisible(true);
      startMenu.style.display = 'none';
    });

    document.getElementById('btnPrevStep3').addEventListener('click', () => {
      startMenu.classList.remove('start-menu-compact');
      document.getElementById('step3').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    });

    // 차량 선택 및 외곽 플로팅 컨트롤 이벤트
    const startMenu = document.getElementById('startMenu');
    const compactCarPopup = document.getElementById('compactCarPopup');
    const compactCarName = document.getElementById('compactCarName');
    const vehicleNameBar = document.getElementById('vehicleNameBar');
    const vehicleNameBarText = document.getElementById('vehicleNameBarText');
    const liveColorPicker = document.getElementById('liveColorPicker');
    const liveColorInput = document.getElementById('liveColorInput');
    const liveColorHex = document.getElementById('liveColorHex');
    const liveStartButton = document.getElementById('liveStartButton');
    const currentCarButton = document.getElementById('currentCarButton');
    const carOptionsPanel = document.getElementById('carOptionsPanel');
    const currentCarName = document.getElementById('currentCarName');

    function setFloatingControlsVisible(isVisible) {
      vehicleNameBar.classList.toggle('is-visible', isVisible);
      liveColorPicker.classList.toggle('is-visible', isVisible);
    }

    function setShowroomMenuCompact(isCompact) {
      if (isCompact) {
        const selectedName = currentCarName.textContent;
        compactCarName.textContent = selectedName;
        vehicleNameBarText.textContent = selectedName;
        carOptionsPanel.setAttribute('hidden', '');
        currentCarButton.classList.remove('is-open');
        currentCarButton.setAttribute('aria-expanded', 'false');
        // 중앙 메뉴는 숨기고 외곽 플로팅 컨트롤만 표시합니다.
        startMenu.classList.remove('start-menu-compact');
        startMenu.style.display = 'none';
        setFloatingControlsVisible(true);
      } else {
        startMenu.style.display = 'block';
        startMenu.classList.remove('start-menu-compact');
        setFloatingControlsVisible(false);
      }
    }

    function openVehicleSelector() {
      setShowroomMenuCompact(false);
      document.getElementById('step2').style.display = 'block';
      document.getElementById('step3').style.display = 'none';
      carOptionsPanel.removeAttribute('hidden');
      currentCarButton.classList.add('is-open');
      currentCarButton.setAttribute('aria-expanded', 'true');
    }

    // 상단의 차량명 바를 누르면 중앙 차량 목록을 다시 엽니다.
    vehicleNameBar.addEventListener('click', (e) => {
      e.stopPropagation();
      openVehicleSelector();
    });

    // 이전 버전의 컴팩트 버튼도 호환 처리합니다.
    compactCarPopup.addEventListener('click', (e) => {
      e.stopPropagation();
      openVehicleSelector();
    });

    currentCarButton.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = carOptionsPanel.hasAttribute('hidden');
      if (isHidden) {
        carOptionsPanel.removeAttribute('hidden');
        currentCarButton.classList.add('is-open');
        currentCarButton.setAttribute('aria-expanded', 'true');
      } else {
        carOptionsPanel.setAttribute('hidden', '');
        currentCarButton.classList.remove('is-open');
        currentCarButton.setAttribute('aria-expanded', 'false');
      }
    });

    // 메뉴 바깥 클릭 시 닫기
    document.addEventListener('click', (e) => {
      if (!currentCarButton.contains(e.target) && !carOptionsPanel.contains(e.target)) {
        carOptionsPanel.setAttribute('hidden', '');
        currentCarButton.classList.remove('is-open');
        currentCarButton.setAttribute('aria-expanded', 'false');
      }
    });

    // 차량 옵션 버튼 클릭 이벤트
    document.querySelectorAll('.car-option-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        document.querySelectorAll('.car-option-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        selectedCarModelName = e.target.getAttribute('data-model');
        currentCarName.textContent = e.target.textContent;
        compactCarName.textContent = e.target.textContent;
        vehicleNameBarText.textContent = e.target.textContent;
        
        // 차량을 선택하면 중앙 메뉴는 사라지고 상단 차량명/좌상단 색상만 남깁니다.
        setShowroomMenuCompact(true);
        await initPreviewCar(selectedCarModelName, selectedCarColor);
      });
    });

    // 컬러 피커 변경 이벤트 (좌상단/Step 3 모두 즉시 실시간 반영)
    const colorInput = document.getElementById('colorInput');
    const colorHexDisplay = document.getElementById('colorHexDisplay');

    function applyPreviewColor(nextColor) {
      selectedCarColor = nextColor;
      colorInput.value = selectedCarColor;
      liveColorInput.value = selectedCarColor;
      colorHexDisplay.textContent = selectedCarColor.toUpperCase();
      liveColorHex.textContent = selectedCarColor.toUpperCase();

      if (previewCarModel) {
        previewCarModel.traverse(child => {
          if (child.isMesh && child.material) {
            const matName = (child.material.name || '').toLowerCase();
            const meshName = (child.name || '').toLowerCase();
            // 차체, 페인트 재질, 또는 MainBody 메쉬인 경우 즉시 색상 변경
            if (meshName === 'mainbody' || meshName === 'body' || matName.includes('body') || matName.includes('paint') || matName.includes('.036')) {
              if (!child.material.color) {
                child.material = child.material.clone();
              }
              child.material.color.set(selectedCarColor);
              child.material.needsUpdate = true;
            }
          }
        });
      }
    }

    colorInput.addEventListener('input', (e) => applyPreviewColor(e.target.value));
    liveColorInput.addEventListener('input', (e) => applyPreviewColor(e.target.value));

    // 좌상단 패널에서도 바로 주행을 시작할 수 있도록 기존 시작 버튼과 연결합니다.
    liveStartButton.addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('startButton').click();
    });

    // 게임 시작 버튼
    document.getElementById('startButton').addEventListener('click', async () => {
      const nickname = document.getElementById('nicknameInput').value.trim();
      if (!nickname) {
        alert('닉네임을 입력하세요!');
        return;
      }
      
      isPreviewActive = false;
      // 게임 화면으로 돌아갈 때 맵용 배경, 안개, 조명 복원
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 160, 600);
      showroomExhibition.visible = false;
      sun.intensity = 1.4;
      ambientLight.intensity = 0.6;
      hemisphereLight.intensity = 0.5;
      showroomKeyLight.intensity = 0;
      showroomFillLight.intensity = 0;
      showroomRimLight.intensity = 0;
      if (previewCarModel) {
        scene.remove(previewCarModel);
        previewCarModel = null;
      }
      document.getElementById('startMenu').style.display = 'none';
      setFloatingControlsVisible(false);
      startGame(selectedCarModelName, selectedCarColor, nickname);
    });

    async function startGame(modelName = 'GrandeurIG', color = '#ffffff', nickname) {
  currentCarModel = modelName;
  socket.emit('joinGame', {
    nickname: nickname,
    carModel: modelName,
    carColor: color
  });

  switch (modelName) {
    case 'GrandeurIG':
      carModel = createGrandeurIGCarDetailed(color); // 동기, await 불필요
      break;
    case 'SportsCar':
      carModel = await createSportsCar(color); // ← await 필수
      break;
    case 'SUV':
      carModel = await createSUVCar(color); 
      break;
    case 'McLarenP1':
      carModel = await createMcLarenP1(color);
      break;
    case 'PontiacPhoenix':
      carModel = await createPontiacPhoenix(color);
      break;
    case 'DodgeDemon':
      carModel = await createDodgeDemon(color);
      break;
    default:
      carModel = createGrandeurIGCarDetailed(color);
  }

  scene.add(carModel);
  // carModel.userData.wheelNodes가 이미 설정되어 있다면 전역 변수 carWheelNodes를 업데이트합니다.
  if (carModel.userData.wheelNodes) {
    carWheelNodes = carModel.userData.wheelNodes;
  } else {
    carModel.userData.wheelNodes = carWheelNodes;
  }
  carModel.userData.modelName = currentCarModel;
  wheelHolders.forEach(h => scene.add(h));
  carModel.userData.steeringNode = steeringWheelNode;

  // 물리 바디 보간용 초기값 설정
  chassisBody.previousPosition = new THREE.Vector3(chassisBody.position.x, chassisBody.position.y, chassisBody.position.z);
  chassisBody.previousQuaternion = new THREE.Quaternion(chassisBody.quaternion.x, chassisBody.quaternion.y, chassisBody.quaternion.z, chassisBody.quaternion.w);

  startTimer();
  updateGearDisplay();
}

// 쇼룸 미리보기를 위해 즉시 애니메이션 루프 시작
animate();
  
</script>
</body>
</html>
